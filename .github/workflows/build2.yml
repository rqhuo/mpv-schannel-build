name: Build libmpv-2.dll v0.41.0 i686 via pwsh — NO pacman NO msys2 shell
on:
  workflow_dispatch:
  push:
    branches: [main]
env:
  MPV_TAG: v0.41.0
  SHINCHIRO_TAG: 20240811
  WORK: C:/mpv-build
  ROOT: C:/mingw32root
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Step 1 Prepare work dirs and 7z wrapper
        run: $ErrorActionPreference='Continue'; New-Item -ItemType Directory -Force -Path $env:WORK | Out-Null; New-Item -ItemType Directory -Force -Path $env:ROOT | Out-Null; function x7z { param($a,$b,$c) Write-Host "7z $a $b $c"; & 7z $a $b $c | Select-Object -Last 3 }; Set-Alias sz x7z -Scope Global -Force; Write-Host "WORK=$env:WORK ROOT=$env:ROOT"

      - name: Step 2 Download mpv-i686 runtime + dev 7z from SHINCHIRO_TAG release (shinchiro official i686 env always carries full mingw32 deps)
        run: $ErrorActionPreference='Stop'; Set-Location $env:WORK; $tag=$env:SHINCHIRO_TAG; function Dload($u,$f){ Write-Host "GET $u -> $f"; try { Invoke-WebRequest -Uri $u -OutFile $f -UseBasicParsing -TimeoutSec 900 -MaximumRetryCount 5 -RetryIntervalSec 5 } catch { Write-Host "FAILED: $_"; exit 21 } }; $rt="https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/$tag/mpv-i686-$tag-git-2cb8249.7z"; $dv="https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/$tag/mpv-dev-i686-$tag-git-2cb8249.7z"; Dload $rt "rt.7z"; Dload $dv "dev.7z"; Write-Host "Sizes: rt=$((Get-Item rt.7z).Length) dev=$((Get-Item dev.7z).Length)"

      - name: Step 3 Extract 7z and locate mingw32 toolchain inside shinchiro package
        run: $ErrorActionPreference='Continue'; Set-Location $env:WORK; New-Item -ItemType Directory -Force -Path (Join-Path $env:ROOT "_unpack") | Out-Null; & 7z x "rt.7z"  "-o$env:ROOT\_unpack" -y | Select-Object -Last 3; & 7z x "dev.7z" "-o$env:ROOT\_unpack" -y | Select-Object -Last 3; Write-Host "Top level under unpack:"; Get-ChildItem -Path (Join-Path $env:ROOT "_unpack") -ErrorAction SilentlyContinue | Select-Object -First 40 Name,Mode; $mingw=$null; $candidates=@((Join-Path $env:ROOT "_unpack"),(Join-Path $env:ROOT "_unpack\mingw32"),(Join-Path $env:ROOT "_unpack\mingw-i686"),(Join-Path $env:ROOT "_unpack\32"),(Join-Path $env:ROOT "_unpack\i686-w64-mingw32")); foreach($p in $candidates){ $g=Join-Path $p "bin\gcc.exe"; if(Test-Path $g){ $mingw=$p; Write-Host "FOUND MINGW=$mingw (gcc exists)"; break } }; if(-not $mingw){ Write-Host "!!! gcc.exe NOT found in any candidate. Recursive depth-3 search:"; Get-ChildItem -Path (Join-Path $env:ROOT "_unpack") -Recurse -Depth 3 -Filter "gcc.exe" -ErrorAction SilentlyContinue | Select-Object -First 10 FullName; exit 22 }; "MINGW=$mingw" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append; Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $mingw "bin"); Write-Host "MINGW=$mingw  (bin\gcc.exe exists)"

      - name: Step 4 Ensure meson + ninja via pip (pure Python, no mingw pkg needed)
        run: $ErrorActionPreference='Continue'; if(-not (Get-Command meson -ErrorAction SilentlyContinue)){ Write-Host "Installing meson + ninja via pip"; python -m pip install --quiet --no-input meson ninja }; if(-not (Get-Command ninja -ErrorAction SilentlyContinue)){ python -m pip install --quiet --no-input ninja }; Write-Host "meson=$(meson --version)"; Write-Host "ninja=$(ninja --version 2>&1 | Select-Object -First 1)"; $pk=$null; if(Test-Path Env:MINGW){ $pk=Join-Path $env:MINGW "bin\pkg-config.exe"; if(Test-Path $pk){ Write-Host "pkg-config(libavcodec)=$(& $pk --modversion libavcodec 2>&1)"; Write-Host "pkg-config(libbluray)=$(& $pk --modversion libbluray 2>&1)"; Write-Host "pkg-config(dvdnav exists rc=$(& $pk --exists dvdnav 2>&1; $LASTEXITCODE))" } }

      - name: Step 5 Clone mpv MPV_TAG and dump SOURCE-OF-TRUTH meson option keys
        run: $ErrorActionPreference='Stop'; Set-Location $env:WORK; git clone --depth 1 --branch $env:MPV_TAG https://github.com/mpv-player/mpv.git mpv; Set-Location mpv; Write-Host "Cloned mpv. Meson option names (TLS/OpenSSL/BD/DVD/EGL/angle related):"; Select-String -Path meson_options.txt -Pattern '^option\(' | ForEach-Object { if($_ -match '^option\(\s*"([^"]+)"'){ $matches[1] } } | Where-Object { $_ -match 'tls|openssl|angle|egl|pthread|win32|jpeg|sdl|libplacebo|lcms|archive|libmpv|cplayer|dvdnav|dvdread|bluray|ffmpeg|libass|lua|javascript|vulkan|iconv' } | Sort-Object -Unique

      - name: Step 6 meson setup (strict env pinning: CC CXX PKG_CONFIG_PATH all absolute)
        run: $ErrorActionPreference='Continue'; Set-Location (Join-Path $env:WORK "mpv"); if(Test-Path build){ Remove-Item -Recurse -Force build }; $m=$env:MINGW; $bin=Join-Path $m "bin"; $env:PKG_CONFIG_LIBDIR=Join-Path $m "lib\pkgconfig"; $env:CMAKE_PREFIX_PATH=$m; $env:CC=Join-Path $bin "gcc.exe"; $env:CXX=Join-Path $bin "g++.exe"; $env:LD=Join-Path $bin "ld.exe"; $env:WINDRES=Join-Path $bin "windres.exe"; $env:PKG_CONFIG=Join-Path $bin "pkg-config.exe"; $before=$env:PATH; $env:PATH="$bin;$before"; Write-Host "CC=$env:CC exists=$(Test-Path $env:CC)"; $argList=@('setup','build','--buildtype=release','--default-library=shared',"--prefix=$m",'-Dlibmpv=true','-Dcplayer=false','-Dtls-backend=schannel','-Dopenssl=disabled','-Diconv=enabled','-Ddvdnav=enabled','-Ddvdread=enabled','-Dlibbluray=enabled','-Dffmpeg=enabled','-Dlibass=enabled','-Dlua=disabled','-Djavascript=disabled','-Dvulkan=enabled','-Degl=enabled','-Dangle-libs=auto','-Djpeg=enabled','-Dlcms2=enabled','-Dlibarchive=enabled','-Dsdl2=disabled','-Dlibplacebo=auto'); Write-Host "meson $($argList -join ' ')"; & meson @argList 2>&1 | Select-Object -Last 140; if($LASTEXITCODE -ne 0){ Write-Host "=== meson FAILED, dump tail of meson-log.txt ==="; $log=Join-Path (Resolve-Path build -ErrorAction SilentlyContinue) "meson-logs\meson-log.txt"; if($log -and (Test-Path $log)){ Get-Content $log -Tail 200 } else { Write-Host "(no meson-log.txt found)" }; exit 26 }; Write-Host "=== meson OK, head of configure summary ==="; & meson configure build 2>&1 | Select-Object -First 80

      - name: Step 7 Compile with meson
        run: $ErrorActionPreference='Continue'; Set-Location (Join-Path $env:WORK "mpv"); $cores=$env:NUMBER_OF_PROCESSORS; Write-Host "meson compile -C build -j$cores"; & meson compile -C build "-j$cores" 2>&1 | Select-Object -Last 100; if($LASTEXITCODE -ne 0){ Write-Host "=== compile FAILED, verbose tail ==="; & meson compile -C build --verbose 2>&1 | Select-Object -Last 260; exit 27 }; Write-Host "Build outputs:"; Get-ChildItem build\libmpv* -ErrorAction SilentlyContinue | Format-Table Name,Length

      - name: Step 8 Collect artifacts DLL + import lib + headers + all mingw runtime DLLs
        run: $ErrorActionPreference='Stop'; $out=Join-Path $env:WORK "output"; New-Item -ItemType Directory -Force -Path (Join-Path $out "include") | Out-Null; $dll=Join-Path $env:WORK "mpv\build\libmpv-2.dll"; if(-not (Test-Path $dll)){ Write-Host "!!! libmpv-2.dll NOT BUILT !!!"; Get-ChildItem (Join-Path $env:WORK "mpv\build") | Format-Table Name,Length; exit 28 }; Copy-Item $dll $out; Copy-Item (Join-Path $env:WORK "mpv\build\libmpv.dll.a") $out -ErrorAction SilentlyContinue; Copy-Item (Join-Path $env:WORK "mpv\libmpv\client.h")    (Join-Path $out "include"); Copy-Item (Join-Path $env:WORK "mpv\libmpv\render.h")    (Join-Path $out "include"); Copy-Item (Join-Path $env:WORK "mpv\libmpv\stream_cb.h") (Join-Path $out "include"); $bin=Join-Path $env:MINGW "bin"; Write-Host "Copying runtime DLLs from $bin"; Get-ChildItem -Path $bin -Filter "*.dll" | Copy-Item -Destination $out -Force -ErrorAction SilentlyContinue; Write-Host "Final output ($((Get-ChildItem $out -Recurse -File | Measure-Object).Count) files):"; Get-ChildItem $out | Format-Table Name,Length -AutoSize

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: libmpv-i686-v0410-schannel-sas
          path: C:/mpv-build/output/
