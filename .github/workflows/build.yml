"name": "Build libmpv-2.dll v0.41.0 (i686) — TIME-CAPSULE pacman DB pinned to 20240811 (last date with FULL mingw32 multimedia tree)"
"on":
  "workflow_dispatch":
  "push":
    "branches": ["main"]
"jobs":
  "build":
    "runs-on": "windows-latest"
    "timeout-minutes": 180
    "steps":
      - "name": "Checkout"
        "uses": "actions/checkout@v4"

      - "name": "Setup base MSYS2 (empty install, no deps via pacboy)"
        "uses": "msys2/setup-msys2@v2"
        "with":
          "msystem": "MINGW32"
          "update": true
          "install": ""

      - "name": "TIME-CAPSULE: replace pacman sync DB with 2024-08-11 snapshot (last mingw32 tree with ffmpeg/libbluray/dvdnav), point mirrors to the official archive"
        "shell": "msys2 {0}"
        "run": |
          set +e
          echo "============================================================"
          echo "[MINGW_PACKAGE_PREFIX] $MINGW_PACKAGE_PREFIX"
          echo "[MSYSTEM]              $MSYSTEM"
          echo "============================================================"

          # Step 1: kill any leftover pacman lock + remove the BROKEN current DBs
          rm -f /var/lib/pacman/db.lck /var/lib/pacman/db.lck.broken
          rm -f /var/lib/pacman/sync/*.db
          rm -f /var/lib/pacman/sync/*.db.tar.gz
          rm -f /var/lib/pacman/sync/*.db.tar.xz
          ls -la /var/lib/pacman/sync/ 2>/dev/null || echo "(sync dir empty, as expected)"

          # Step 2: download the 2024-08-11 pacman sync DB snapshots from the official MSYS2 archive
          # Archive URL pattern is:  https://archive.msys2.org/YYYY/MM/YYYY-MM-DD/<repo>.db.tar.xz
          #   - mingw32.db.tar.xz -> for i686 packages (ffmpeg, bluray, etc.)
          #   - msys.db.tar.xz    -> for core msys runtime (bash, pacman, autotools, etc.)
          echo "--- Downloading archived pacman DBs for 2024-08-11 ---"
          cd /tmp
          for pair in "mingw32:mingw/i686" "msys:msys/x86_64"; do
            repo="${pair%%:*}"
            sub="${pair#*:}"
            url="https://archive.msys2.org/2024/08/2024-08-11/${repo}.db.tar.xz"
            echo "  $repo <- $url"
            curl -fsSL --retry 5 --retry-delay 3 --connect-timeout 30 -o "${repo}.db.tar.xz" "$url"
            rc=$?
            echo "   rc=$rc  size=$(stat --printf=%s ${repo}.db.tar.xz 2>/dev/null || echo 0) bytes"
            if [ "$rc" -ne 0 ] || [ ! -s "${repo}.db.tar.xz" ]; then
              echo "   archive.msys2.org failed, trying secondary mirror msys2.org/2024/ ..."
              url2="https://repo.msys2.org/archive/2024/08/2024-08-11/${repo}.db.tar.xz"
              curl -fsSL --retry 5 --retry-delay 3 --connect-timeout 30 -o "${repo}.db.tar.xz" "$url2" || true
            fi
            if [ ! -s "${repo}.db.tar.xz" ]; then
              echo "!!! Failed to fetch ${repo} DB even after retry !!!"
              exit 12
            fi
            tar -xJf "${repo}.db.tar.xz" -C /var/lib/pacman/sync/ "${repo}.db" 2>/dev/null || \
            (
              mkdir -p "/var/lib/pacman/sync/_${repo}"
              tar -xJf "${repo}.db.tar.xz" -C "/var/lib/pacman/sync/_${repo}"
              cd "/var/lib/pacman/sync/_${repo}"
              # Some archive tarballs extract to folder per entry, concatenate desc -> db
              find . -name 'desc' -exec cat {} + > "../${repo}.db"
              rm -rf "/var/lib/pacman/sync/_${repo}"
            )
          done

          ls -la /var/lib/pacman/sync/
          echo ""
          echo "--- Re-point mirrorlist to OFFICIAL ARCHIVE so every old URL resolves ---"
          cat > /etc/pacman.d/mirrorlist.mingw32 <<'EOF'
          # 2024-08-11 archive exact match
          Server = https://archive.msys2.org/2024/08/2024-08-11/mingw/i686
          # Fallback: current official repo (archive packages are kept side-by-side)
          Server = https://repo.msys2.org/mingw/i686
          # Fallback 2: TUNA historical mirror
          Server = https://mirrors.tuna.tsinghua.edu.cn/msys2/archive/2024/08/2024-08-11/mingw/i686
          EOF
          cat > /etc/pacman.d/mirrorlist.msys <<'EOF'
          Server = https://archive.msys2.org/2024/08/2024-08-11/msys/x86_64
          Server = https://repo.msys2.org/msys/x86_64
          Server = https://mirrors.tuna.tsinghua.edu.cn/msys2/archive/2024/08/2024-08-11/msys/x86_64
          EOF
          cat > /etc/pacman.d/mirrorlist.mingw64 <<'EOF'
          Server = https://archive.msys2.org/2024/08/2024-08-11/mingw/x86_64
          EOF

          # We do NOT run -Sy / -Syy any more — we just hand-placed the exact DB we want.
          echo "--- Sanity check: how many $MINGW_PACKAGE_PREFIX packages are NOW visible to pacman? ---"
          total=$(pacman -Sl 2>/dev/null | grep -c "^mingw32 ${MINGW_PACKAGE_PREFIX}" || echo 0)
          echo "[Total packages] $total (should be > 4000 this time)"

          if [ "$total" -lt 2000 ]; then
            echo "!!! package count still low after time-capsule DB !!! Dumping matches for multimedia queries !!!"
            for p in ffmpeg libbluray libdvdnav dvdread libdvdcss shaderc spirv-cross libplacebo mujs vulkan-loader angle lcms2 libass libjpeg-turbo libarchive; do
              echo "--- pacman -Ss $p ---"
              pacman -Ss "$p" 2>/dev/null | grep '^mingw32/' | head -n 5 || echo "(no match)"
            done
            exit 13
          fi

          echo "=== Sample matches for the 3 most critical packages we need ==="
          for p in ffmpeg libbluray libdvdnav; do
            echo "--- $p ---"
            pacman -Ss "^${MINGW_PACKAGE_PREFIX}${p}$" 2>/dev/null | head -n 3 || echo "(NOT FOUND — bad sign)"
          done
          echo "=== TIME CAPSULE ready. ==="

      - "name": "Install ALL build deps (use MINGW_PACKAGE_PREFIX, time-capsule DB will resolve them to 20240811 binaries)"
        "shell": "msys2 {0}"
        "run": |
          set -e
          PFX="$MINGW_PACKAGE_PREFIX"
          echo "[Using prefix] $PFX"
          PKGS=(
            "toolchain" "meson" "pkgconf" "nasm"
            "ffmpeg" "libass" "libjpeg-turbo" "libbluray"
            "libdvdnav" "libdvdread" "libdvdcss"
            "shaderc" "spirv-cross" "lcms2" "libarchive" "mujs"
            "vulkan-loader" "angle-library" "libplacebo" "vulkan-headers"
          )
          FULL_PKGS=()
          for p in "${PKGS[@]}"; do FULL_PKGS+=("${PFX}${p}"); done
          echo "Packages: ${FULL_PKGS[*]}"
          echo ""

          # pacman -Sy ONLY to re-read the local time-capsule DB we just put in place (no network refresh)
          pacman -Sy --noconfirm 2>&1 | tail -n 5 || true

          set +e
          pacman -S --noconfirm --needed --disable-download-timeout --overwrite='*' "${FULL_PKGS[@]}" 2>&1 | tail -n 100
          rc=$?
          set -e
          echo "[pacman -S rc=$rc]"
          echo "=== Verify mandatory ==="
          miss=0
          for p in ffmpeg libbluray libdvdnav libdvdread shaderc libplacebo meson pkgconf nasm gcc; do
            full="${PFX}${p}"
            if pacman -Qs "^${full}$" >/dev/null 2>&1; then
              echo "  OK     $full"
            else
              echo "  MISS   $full"
              miss=$((miss+1))
            fi
          done
          if [ "$miss" -gt 0 ]; then
            echo "!!! $miss mandatory packages MISS. Outputting broader searches. !!!"
            for p in ffmpeg libbluray libdvdnav shaderc libplacebo angle vulkan; do
              echo "--- broader $p ---"
              pacman -Ss "$p" 2>/dev/null | grep '^mingw32/' | head -n 6 || true
            done
            exit 14
          fi
          echo "All mandatory packages present."
          pkg-config --exists libavcodec  && echo "[pkg-config] libavcodec  YES $(pkg-config --modversion libavcodec)"  || echo "[pkg-config] libavcodec  NO"
          pkg-config --exists libbluray   && echo "[pkg-config] libbluray   YES"  || echo "[pkg-config] libbluray   NO"
          pkg-config --exists dvdnav       && echo "[pkg-config] dvdnav       YES"  || echo "[pkg-config] dvdnav       NO"
          gcc --version | head -n 1
          meson --version

      - "name": "Clone mpv v0.41.0 and dump its REAL meson option names"
        "shell": "msys2 {0}"
        "run": |
          set -e
          rm -rf mpv
          git clone --depth 1 --branch v0.41.0 https://github.com/mpv-player/mpv.git mpv
          cd mpv
          echo "=== mpv v0.41.0 relevant meson options (source-of-truth dump) ==="
          grep -E '^option\s*\(' meson_options.txt | awk -F'"' '/^option\(/{print $2}' | grep -Ei "tls|openssl|angle|egl|pthread|win32|jpeg|sdl|libplacebo|lcms|archive|libmpv|cplayer|dvdnav|dvdread|bluray|ffmpeg|libass|lua|javascript|vulkan|iconv" | sort -u

      - "name": "Configure meson"
        "shell": "msys2 {0}"
        "run": |
          set -e
          cd mpv
          rm -rf build
          set +e
          meson setup build \
            --buildtype=release \
            --default-library=shared \
            --prefix=/mingw32 \
            -Dlibmpv=true \
            -Dcplayer=false \
            -Dtls-backend=schannel \
            -Dopenssl=disabled \
            -Diconv=enabled \
            -Ddvdnav=enabled \
            -Ddvdread=enabled \
            -Dlibbluray=enabled \
            -Dffmpeg=enabled \
            -Dlibass=enabled \
            -Dlua=disabled \
            -Djavascript=disabled \
            -Dvulkan=enabled \
            -Degl=enabled \
            -Dangle-libs=auto \
            -Djpeg=enabled \
            -Dlcms2=enabled \
            -Dlibarchive=enabled \
            -Dsdl2=disabled \
            -Dlibplacebo=auto
          rc=$?
          set -e
          if [ $rc -ne 0 ]; then
            echo "=== meson setup FAILED, tail log ==="
            if [ -f build/meson-logs/meson-log.txt ]; then tail -n 150 build/meson-logs/meson-log.txt; else echo "(no meson-log.txt)"; fi
            echo "=== TRUE option names from meson_options.txt ==="
            grep -E '^option\s*\(' meson_options.txt | awk -F'"' '/^option\(/{print $2}' | sort -u
            exit $rc
          fi
          echo "=== meson SUCCESS, configure summary (top) ==="
          meson configure build 2>&1 | head -n 80

      - "name": "Compile"
        "shell": "msys2 {0}"
        "run": |
          set -e
          cd mpv
          cores="${NUMBER_OF_PROCESSORS:-2}"
          echo ">>> Compiling with $cores cores <<<"
          set +e
          meson compile -C build -j"$cores" 2>&1 | tail -n 80
          rc=${PIPESTATUS[0]}
          set -e
          if [ $rc -ne 0 ]; then
            echo "=== compile FAILED, last 260 verbose lines ==="
            meson compile -C build --verbose 2>&1 | tail -n 260
            exit $rc
          fi
          echo "=== Build outputs ==="
          ls -la build/libmpv* 2>/dev/null
          (ldd build/libmpv-2.dll || true) 2>/dev/null | head -n 30

      - "name": "Collect artifacts"
        "shell": "msys2 {0}"
        "run": |
          set -e
          rm -rf output
          mkdir -p output/include
          if [ ! -f mpv/build/libmpv-2.dll ]; then echo "!!! libmpv-2.dll NOT BUILT !!!"; ls -la mpv/build/; exit 19; fi
          cp mpv/build/libmpv-2.dll output/
          cp mpv/build/libmpv.dll.a output/ 2>/dev/null || true
          cp mpv/libmpv/client.h output/include/
          cp mpv/libmpv/render.h output/include/
          cp mpv/libmpv/stream_cb.h output/include/
          cd output
          if command -v ldd >/dev/null 2>&1; then
            ldd libmpv-2.dll | grep -E '/mingw|mingw32' | awk '{print $3}' | while read -r dll; do
              [ -f "$dll" ] && cp "$dll" . || true
            done
          fi
          echo "=== Final artifacts ==="
          ls -la
          echo "Total files: $(find . -type f | wc -l)"

      - "name": "Upload artifacts"
        "if": "always()"
        "uses": "actions/upload-artifact@v4"
        "with":
          "name": "libmpv-i686-v0410-schannel-timecapsule"
          "path": "output/"
