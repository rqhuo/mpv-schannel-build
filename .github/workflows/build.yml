name: build-libmpv-i686-schannel

# =============================================================================
# Build a 32-bit (i686) libmpv-2.dll with Windows Schannel TLS and NO OpenSSL,
# using shinchiro/mpv-winbuild-cmake.
#
# How it works (v2, complete rewrite):
#   The superbuild is designed to run on LINUX (that is how upstream's own CI
#   builds mpv): it first cross-compiles its own i686-w64-mingw32 GCC
#   toolchain, then builds ~80 dependencies + ffmpeg + mpv from source, all
#   statically linked into mpv.exe / libmpv-2.dll.
#   Running it on windows-latest/MSYS2 (the old approach) fights the build
#   system (bash-only `exec` launcher, impl.cmake CreateProcess issues, ...)
#   and never completed. This workflow follows upstream's supported path.
#
# Schannel switch (patches/patch_schannel.py, applied before configure):
#   ffmpeg:     --enable-openssl  -> --enable-schannel
#               drops libssh / libsrt / libaribcaption (they all need openssl)
#   curl:       CURL_USE_OPENSSL=OFF + CURL_USE_SCHANNEL=ON,
#               drops HTTP/3 (ngtcp2/nghttp3, openssl-only) and libssh
#   libarchive: ENABLE_OPENSSL=OFF
#   mpv / mpv-release: drop subrandr (X11-only; upstream hard-panics on
#               i686-pc-windows-gnu, issue afishhh/subrandr#31) -> -Dsubrandr=disabled
#   => nothing in the mpv build DAG references the openssl package anymore.
#      https streaming in mpv goes through Windows' own TLS stack and uses
#      the system certificate store (no cacert.pem needed).
#
# Outputs (job artifact "libmpv-2-i686-schannel"):
#   libmpv-2.dll      32-bit libmpv for LoadLibrary (Easy Language etc.)
#   libmpv.dll.a      import library (for MinGW/C consumers)
#   include/mpv/*.h   client API headers
#   mpv.exe / mpv.com the player itself
#   schannel-check.txt  proof: DLL imports SECUR32.dll, no OpenSSL strings
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      mpv_target:
        description: 'mpv target to build'
        required: false
        default: 'mpv-release'
        type: choice
        options:
          - mpv-release
          - mpv
  push:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'
      - 'patches/**'
  # Automatically rebuild on a schedule so the artifact always tracks the
  # latest stable mpv / ffmpeg. The superbuild fetches the newest release tag
  # at build time (packages/mpv-release.cmake queries /releases/latest), so a
  # periodic rebuild = automatic pickup of new versions.
  # Disable or retune the cron if you don't want periodic rebuilds.
  schedule:
    - cron: '0 18 * * 0'   # every Sunday 18:00 UTC (~02:00 Beijing, Monday)

concurrency:
  group: build-libmpv-i686-schannel
  cancel-in-progress: true

jobs:
  build:
    name: libmpv-2.dll i686 (schannel, no openssl)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    container:
      image: ghcr.io/shinchiro/archlinux:latest
    env:
      MPV_TARGET: ${{ inputs.mpv_target || 'mpv-release' }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Setup git config
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout this repository
        uses: actions/checkout@v4

      # Cache the whole mpv-winbuild tree: cross toolchain (build/install),
      # ccache, package stamps and downloaded sources (src_packages).
      # Fresh run: ~2-3 h. Cached run: toolchain skipped, only changed
      # packages rebuild.
      - name: Restore build cache
        uses: actions/cache/restore@v4
        with:
          path: mpv-winbuild
          key: i686-schannel-build-${{ github.run_id }}
          restore-keys: |
            i686-schannel-build-

      - name: Clone / update shinchiro superbuild
        run: |
          if [ ! -d mpv-winbuild/.git ]; then
            git clone https://github.com/shinchiro/mpv-winbuild-cmake.git mpv-winbuild
          fi
          git -C mpv-winbuild fetch origin master
          git -C mpv-winbuild checkout -f FETCH_HEAD
          echo "SUPERBUILD_HEAD=$(git -C mpv-winbuild rev-parse --short HEAD)"

      - name: Patch superbuild (openssl -> schannel)
        run: |
          python3 patches/patch_schannel.py mpv-winbuild
          echo "---- full diff applied to superbuild ----"
          git -C mpv-winbuild --no-pager diff

      - name: CMake configure (TARGET_ARCH=i686-w64-mingw32)
        run: |
          cd mpv-winbuild
          cmake --fresh -G Ninja -B build -S . \
            -DTARGET_ARCH=i686-w64-mingw32 \
            -DSINGLE_SOURCE_LOCATION="$PWD/src_packages" \
            -DRUSTUP_LOCATION="$PWD/build/install_rustup" \
            -DENABLE_CCACHE=ON

      - name: Download package sources
        run: |
          ninja -C mpv-winbuild/build download || true

      - name: Build cross toolchain (gcc, ~20-40 min, cached afterwards)
        run: |
          if [ ! -x mpv-winbuild/build/install/bin/cross-gcc ]; then
            ninja -C mpv-winbuild/build gcc
          else
            echo "cross-gcc found in cache, skipping toolchain build"
          fi
          ls -la mpv-winbuild/build/install/bin/ | head -20

      - name: Update cached git packages (no-op on fresh run)
        run: |
          ninja -C mpv-winbuild/build update || true

      - name: Build mpv (target ${{ env.MPV_TARGET }})
        run: |
          # Force a clean (re)configure of the mpv target. The superbuild
          # caches the whole tree between runs; a previously failed configure
          # can leave a half-initialised meson build dir that makes `meson
          # setup` choke on the next attempt. Wipe only this target's prefix
          # so it rebuilds from scratch while every other package (ffmpeg,
          # the cross toolchain, ...) is reused from cache.
          #
          # IMPORTANT: also remove the versioned package folder
          # (build/mpv-<version>-i686) and build/mpv-package. These live in
          # build/ (NOT under packages/mpv-release-prefix) so the rm above
          # does not touch them. On a cached re-run they already exist from
          # the previous build, and shinchiro's rename-stable.sh does an `mv`
          # into build/mpv-<version>-i686/mpv-package which fails with
          # "Directory not empty" when that destination is non-empty. Wiping
          # it first makes the move deterministic.
          rm -rf "mpv-winbuild/build/packages/mpv-release-prefix" \
                 "mpv-winbuild/build/packages/mpv-prefix" \
                 "mpv-winbuild/build/mpv-"*i686* \
                 "mpv-winbuild/build/mpv-package" 2>/dev/null || true
          ninja -C mpv-winbuild/build "$MPV_TARGET"

      - name: Collect artifacts + verify Schannel build
        run: |
          set -e
          B="$GITHUB_WORKSPACE/mpv-winbuild/build"
          OUT="$GITHUB_WORKSPACE/artifact"
          mkdir -p "$OUT/include/mpv"

          if [ "$MPV_TARGET" = "mpv" ]; then
            BD="$B/packages/mpv-prefix/src/mpv-build"
            SRC="$GITHUB_WORKSPACE/mpv-winbuild/src_packages/mpv"
          else
            BD="$B/packages/mpv-release-prefix/src/mpv-release-build"
            SRC="$GITHUB_WORKSPACE/mpv-winbuild/src_packages/mpv-release"
          fi
          echo "mpv build dir: $BD"
          ls -la "$BD" | head -30

          cp -f "$BD/libmpv-2.dll"  "$OUT/libmpv-2.dll"
          cp -f "$BD/libmpv.dll.a"  "$OUT/libmpv.dll.a"
          cp -f "$SRC"/include/mpv/*.h "$OUT/include/mpv/"

          # mpv.exe / mpv.com from the renamed package folder (mpv-vX.Y.Z-i686)
          PKG="$(find "$B" -maxdepth 1 -type d -name 'mpv-*i686*' -print -quit || true)"
          if [ -n "$PKG" ]; then
            echo "package dir: $PKG"
            cp -f "$PKG/mpv.exe" "$OUT/" 2>/dev/null || true
            cp -f "$PKG/mpv.com" "$OUT/" 2>/dev/null || true
          fi

          # ---- verification: the DLL must use Schannel, not OpenSSL ----
          # We grep the RAW binary with `grep -a` (treat file as text) instead
          # of `strings`. Newer GNU `strings` only scans *allocated* sections
          # by default and SKIPS the PE import table, so it never sees
          # "Secur32.dll" and would report a false negative on the CI runner.
          # `grep -a` reads the whole file and is version-independent.
          : > "$OUT/schannel-check.txt"
          {
            echo "libmpv-2.dll size: $(stat -c%s "$OUT/libmpv-2.dll") bytes"
            echo
            echo "OpenSSL version strings inside libmpv-2.dll (expect none):"
            # A real OpenSSL link leaves a banner like "OpenSSL 1.1.1"/"OpenSSL 3.0.0".
            # ffmpeg also contains a static message "recompile FFmpeg with openssl, ..."
            # that has NO version digit right after 'openssl', so this pattern is safe.
            if grep -aqiE "openssl [0-9]" "$OUT/libmpv-2.dll"; then
              echo "!!! OpenSSL DETECTED - build is NOT schannel-only"
              exit 31
            else
              echo "(none - good)"
            fi
            echo
            echo "Schannel/SSPI stack referenced (Secur32 + Crypt32 required):"
            sec=$(grep -aqi "secur32" "$OUT/libmpv-2.dll" && echo yes || echo no)
            crp=$(grep -aqi "crypt32" "$OUT/libmpv-2.dll" && echo yes || echo no)
            ncr=$(grep -aqi "ncrypt"  "$OUT/libmpv-2.dll" && echo yes || echo no)
            if [ "$sec" = "yes" ] && [ "$crp" = "yes" ]; then
              echo "Secur32.dll + CRYPT32.dll referenced - Schannel present (good) [ncrypt=$ncr]"
            else
              echo "!!! Schannel SSPI NOT referenced (secur32=$sec crypt32=$crp) - schannel missing?"
              exit 32
            fi
          } | tee -a "$OUT/schannel-check.txt"

          echo "==== artifact ===="
          ls -la "$OUT" "$OUT/include/mpv"

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: libmpv-2-i686-schannel
          path: artifact/
          if-no-files-found: error
          compression-level: 6

      - name: Collect failure logs
        if: failure()
        run: |
          mkdir -p "$GITHUB_WORKSPACE/faillogs"
          cd mpv-winbuild/build 2>/dev/null || exit 0
          find . -type f \( -iname "*-*.log" -o -wholename "*/ffbuild/config.log" \) \
            -exec cp --parents {} "$GITHUB_WORKSPACE/faillogs/" \; 2>/dev/null || true

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: libmpv-2-i686-schannel-faillogs
          path: faillogs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Save build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: mpv-winbuild
          key: i686-schannel-build-${{ github.run_id }}
