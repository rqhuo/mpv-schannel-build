"name": "Build libmpv-2.dll v0.41.0 (i686, no-OpenSSL assertion, FALLBACK MIRRORS)"
"on":
  "workflow_dispatch":
  "push":
    "branches": ["main"]
"jobs":
  "build":
    "runs-on": "windows-latest"
    "steps":
      - "name": "Checkout"
        "uses": "actions/checkout@v4"

      - "name": "Setup MSYS2 MINGW32 base (let action do step-1 update)"
        "uses": "msys2/setup-msys2@v2"
        "with":
          "msystem": "MINGW32"
          "update": true
          "install": ""

      - "name": "Fix: Replace mingw32 mirror list with OFFICIAL + well-known mirrors (because default CDN on this runner only synced 248 pkgs, missing all ffmpeg-level deps)"
        "shell": "msys2 {0}"
        "run": |
          set +e
          echo "=== Before: mirrorlist.mingw32 ==="
          cat /etc/pacman.d/mirrorlist.mingw32 2>/dev/null | head -n 20
          echo ""
          echo "=== Write new mirrorlist (official master + 5 mirrors that carry full i686 trees) ==="
          cat > /etc/pacman.d/mirrorlist.mingw32 <<'EOF'
          # MSYS2 official mirror (master)
          Server = https://repo.msys2.org/mingw/i686
          # Mirror 1: OSDN Japan (full package set, reliable)
          Server = https://mirrors.tuna.tsinghua.edu.cn/msys2/mingw/i686
          # Mirror 2: TUNA China (full package set, fast for runners on Azure Asia)
          Server = https://mirrors.tuna.tsinghua.edu.cn/msys2/mingw/i686
          # Mirror 3: USTC China
          Server = https://mirrors.ustc.edu.cn/msys2/mingw/i686
          # Mirror 4: NCHC Taiwan
          Server = https://free.nchc.org.tw/osdn//mingw/i686
          # Mirror 5: CDN77
          Server = https://mirror.msys2.org/mingw/i686
          EOF
          cat /etc/pacman.d/mirrorlist.mingw32
          echo ""
          echo "Also update msys core mirror (same rationale)"
          cat > /etc/pacman.d/mirrorlist.msys <<'EOF'
          Server = https://repo.msys2.org/msys/x86_64
          Server = https://mirrors.tuna.tsinghua.edu.cn/msys2/msys/x86_64
          Server = https://mirrors.ustc.edu.cn/msys2/msys/x86_64
          Server = https://mirror.msys2.org/msys/x86_64
          EOF
          rm -f /var/lib/pacman/db.lck /var/lib/pacman/sync/*.db
          echo "=== Force full DB redownload from new mirrors [pacman -Syy] ==="
          pacman -Syy --noconfirm --disable-download-timeout 2>&1 | tail -n 25
          rc=$?
          echo "[rc=$rc]"
          total_after=$(pacman -Sl 2>/dev/null | grep -c "^mingw32 ${MINGW_PACKAGE_PREFIX}" || echo 0)
          echo "[After new mirrors] Seen in repo: $total_after i686 packages (expect >3000)"
          if [ "$total_after" -lt 500 ]; then
            echo "!!! Still <500 packages. Dump all i686 package names so we can see the true list !!!"
            pacman -Sl 2>/dev/null | grep "^mingw32 ${MINGW_PACKAGE_PREFIX}" | awk '{print $2}' | sort -u > /tmp/i686_pkgs.txt
            wc -l /tmp/i686_pkgs.txt
            head -n 80 /tmp/i686_pkgs.txt
            echo "..."
            grep -Ei 'ffmpeg|bluray|dvdnav|dvdread|shaderc|libass|lcms|placebo' /tmp/i686_pkgs.txt || echo "(none matched)"
            exit 5
          fi
          echo "=== Mirror fallback is successful. Re-search ffmpeg ==="
          pacman -Ss "^${MINGW_PACKAGE_PREFIX}ffmpeg$" 2>/dev/null | head -n 3
          echo "=== Mirror setup OK ==="

      - "name": "Install build deps using $MINGW_PACKAGE_PREFIX"
        "shell": "msys2 {0}"
        "run": |
          set -e
          PFX="$MINGW_PACKAGE_PREFIX"
          echo "[Using prefix] $PFX"

          PKGS=(
            "toolchain"
            "meson"
            "pkgconf"
            "nasm"
            "ffmpeg"
            "libass"
            "libjpeg-turbo"
            "libbluray"
            "libdvdnav"
            "libdvdread"
            "libdvdcss"
            "shaderc"
            "spirv-cross"
            "lcms2"
            "libarchive"
            "mujs"
            "vulkan-loader"
            "angle-library"
            "libplacebo"
            "vulkan-headers"
          )
          FULL_PKGS=()
          for p in "${PKGS[@]}"; do FULL_PKGS+=("${PFX}${p}"); done

          echo "=== Packages to install ==="
          printf '  %s\n' "${FULL_PKGS[@]}"
          echo ""

          set +e
          pacman -S --noconfirm --needed --disable-download-timeout "${FULL_PKGS[@]}" 2>&1 | tail -n 80
          rc=$?
          set -e
          echo "[pacman -S exit code] $rc"

          echo "=== Verify mandatory packages ==="
          miss=0
          for p in ffmpeg libass libbluray libdvdnav libdvdread shaderc libplacebo meson pkgconf nasm gcc; do
            full="${PFX}${p}"
            if pacman -Qs "^${full}$" >/dev/null 2>&1; then
              echo "  OK     $full"
            else
              echo "  MISS   $full"
              miss=$((miss+1))
            fi
          done
          if [ "$miss" -gt 0 ]; then
            echo "!!! $miss mandatory packages missing. Broader search for similar names: !!!"
            for p in ffmpeg libbluray libdvdnav shaderc libplacebo; do
              echo "--- $p ---"
              pacman -Ss "$p" 2>/dev/null | grep '^mingw32/' | head -n 5 || true
            done
            exit 3
          fi
          echo "All mandatory packages are present."
          pkg-config --exists libavcodec  && echo "[pkg-config] libavcodec  YES $(pkg-config --modversion libavcodec)"  || echo "[pkg-config] libavcodec  NO"
          pkg-config --exists libbluray   && echo "[pkg-config] libbluray   YES"                                  || echo "[pkg-config] libbluray   NO"
          pkg-config --exists dvdnav       && echo "[pkg-config] dvdnav       YES"                                  || echo "[pkg-config] dvdnav       NO"
          which gcc && gcc --version | head -n 1 || echo "[gcc] NOT FOUND"
          meson --version | awk '{print "[meson version] " $0}'

      - "name": "Clone mpv v0.41.0 + dump REAL meson option names"
        "shell": "msys2 {0}"
        "run": |
          set -e
          rm -rf mpv
          git clone --depth 1 --branch v0.41.0 https://github.com/mpv-player/mpv.git mpv
          cd mpv
          echo "=== mpv v0.41.0 relevant meson options ==="
          awk '/^option\(/ {
            match($0, /^option\(\s*"([^"]+)"/, a)
            if (a[1] != "") print a[1]
          }' meson_options.txt | grep -Ei "tls|openssl|angle|egl|pthread|win32|jpeg|sdl|libplacebo|lcms|archive|libmpv|cplayer|dvdnav|dvdread|bluray|ffmpeg|libass|lua|javascript|vulkan|iconv" | sort -u

      - "name": "Configure meson"
        "shell": "msys2 {0}"
        "run": |
          set -e
          cd mpv
          rm -rf build
          set +e
          meson setup build \
            --buildtype=release \
            --default-library=shared \
            --prefix="/mingw32" \
            -Dlibmpv=true \
            -Dcplayer=false \
            -Dtls-backend=schannel \
            -Dopenssl=disabled \
            -Diconv=enabled \
            -Ddvdnav=enabled \
            -Ddvdread=enabled \
            -Dlibbluray=enabled \
            -Dffmpeg=enabled \
            -Dlibass=enabled \
            -Dlua=disabled \
            -Djavascript=disabled \
            -Dvulkan=enabled \
            -Degl=enabled \
            -Dangle-libs=auto \
            -Djpeg=enabled \
            -Dlcms2=enabled \
            -Dlibarchive=enabled \
            -Dsdl2=disabled \
            -Dlibplacebo=auto
          rc=$?
          set -e
          if [ $rc -ne 0 ]; then
            echo "=== meson FAILED, tail log ==="
            if [ -f build/meson-logs/meson-log.txt ]; then tail -n 150 build/meson-logs/meson-log.txt; else echo "(no meson-log.txt)"; fi
            echo "=== True option names ==="
            awk '/^option\(/ { match($0, /^option\(\s*"([^"]+)"/, a); if (a[1] != "") print a[1] }' meson_options.txt | sort -u
            exit $rc
          fi
          echo "=== meson SUCCESS, top of configure summary ==="
          meson configure build 2>&1 | head -n 80

      - "name": "Compile"
        "shell": "msys2 {0}"
        "run": |
          set -e
          cd mpv
          cores="${NUMBER_OF_PROCESSORS:-2}"
          echo ">>> Compiling with $cores cores <<<"
          set +e
          meson compile -C build -j"$cores" 2>&1 | tail -n 60
          rc=${PIPESTATUS[0]}
          set -e
          if [ $rc -ne 0 ]; then
            echo "=== compile FAILED, last 220 verbose lines ==="
            meson compile -C build --verbose 2>&1 | tail -n 220
            exit $rc
          fi
          echo "=== Build outputs ==="
          ls -la build/libmpv* 2>/dev/null
          (ldd build/libmpv-2.dll || true) 2>/dev/null | head -n 30

      - "name": "Collect artifacts"
        "shell": "msys2 {0}"
        "run": |
          set -e
          rm -rf output
          mkdir -p output/include
          if [ ! -f mpv/build/libmpv-2.dll ]; then
            echo "!!! libmpv-2.dll not built !!!"
            ls -la mpv/build/
            exit 2
          fi
          cp mpv/build/libmpv-2.dll output/
          cp mpv/build/libmpv.dll.a output/ 2>/dev/null || true
          cp mpv/libmpv/client.h output/include/
          cp mpv/libmpv/render.h output/include/
          cp mpv/libmpv/stream_cb.h output/include/
          cd output
          if command -v ldd >/dev/null 2>&1; then
            ldd libmpv-2.dll | grep -E '/mingw|mingw32' | awk '{print $3}' | while read -r dll; do
              [ -f "$dll" ] && cp "$dll" . || true
            done
          fi
          echo "=== Final artifacts ==="
          ls -la
          echo "Total files: $(find . -type f | wc -l)"

      - "name": "Upload artifacts"
        "if": "always()"
        "uses": "actions/upload-artifact@v4"
        "with":
          "name": "libmpv-i686-v0410-schannel"
          "path": "output/"
