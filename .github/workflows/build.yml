"name": "Build libmpv-2.dll v0.41.0 (i686, no-OpenSSL assertion)"
"on":
  "workflow_dispatch":
  "push":
    "branches": ["main"]
"jobs":
  "build":
    "runs-on": "windows-latest"
    "steps":
      - "name": "Checkout"
        "uses": "actions/checkout@v4"

      - "name": "Setup MSYS2 MINGW32 (let the action itself do step-1 pacman -Syu via update:true)"
        "uses": "msys2/setup-msys2@v2"
        "with":
          "msystem": "MINGW32"
          # KEY: 开启 action 内建的 update:true → 它内部会正确处理 "需要重启 shell 的 pacman 升级"
          "update": true
          # 不再在这里装任何包,避免 pacboy expansion bug 与 install 阶段的冲突
          "install": ""

      - "name": "Print env + prepare pacman DB (refresh only, no upgrade loop)"
        "shell": "msys2 {0}"
        "run": |
          # IMPORTANT: do NOT use `set -e` for this whole step because:
          #   - pacman -Sy may exit non-0 on transient mirror errors
          #   - pacman lock file left by the action's internal -Syu is harmless after clearing
          set +e
          echo "============================================================"
          echo "[MINGW_PACKAGE_PREFIX] $MINGW_PACKAGE_PREFIX"
          echo "[MSYSTEM]              $MSYSTEM"
          echo "[PATH head]            $(echo $PATH | tr ':' '\n' | head -n 10 | tr '\n' ' ')"
          echo "============================================================"

          echo "--- 1) Clear stale pacman lock ---"
          rm -f /var/lib/pacman/db.lck /var/lib/pacman/db.lck.broken
          ls -la /var/lib/pacman/ | head

          echo "--- 2) Pacman version + arch ---"
          pacman --version | head -n 3
          uname -a

          echo "--- 3) Refresh package databases only (NOT upgrade world) [pacman -Sy] ---"
          pacman -Sy --noconfirm --disable-download-timeout 2>&1 | tail -n 15
          rc_refresh=$?
          echo "[rc=$rc_refresh] (0=ok, anything else see above)"

          echo "--- 4) How many ${MINGW_PACKAGE_PREFIX}* packages can pacman see right now? ---"
          total=$(pacman -Sl 2>/dev/null | grep -c "^mingw32 ${MINGW_PACKAGE_PREFIX}" || echo 0)
          echo "[Seen in repo] $total i686 packages"

          echo "--- 5) Search: is ffmpeg actually there? ---"
          hit=$(pacman -Ss "^${MINGW_PACKAGE_PREFIX}ffmpeg$" 2>/dev/null | head -n 3 || echo "")
          if [ -n "$hit" ]; then
            echo "FOUND $hit"
            ENV_OK=1
          else
            echo "NOT FOUND. Trying broader search:"
            pacman -Ss ffmpeg 2>/dev/null | grep '^mingw32/' | head -n 10
            echo ""
            echo "*** Fallback: attempt pacman -Syy (force refresh all dbs from scratch) ***"
            pacman -Syy --noconfirm --disable-download-timeout 2>&1 | tail -n 15 || true
            hit2=$(pacman -Ss "^${MINGW_PACKAGE_PREFIX}ffmpeg$" 2>/dev/null | head -n 3 || echo "")
            if [ -n "$hit2" ]; then
              echo "NOW FOUND after -Syy: $hit2"
              ENV_OK=1
            else
              echo "STILL NOT FOUND. Aborting build so we can diagnose repos."
              echo "=== pacman.conf repos ==="
              grep -E '^\s*\[|\s*Server\s*=' /etc/pacman.conf /etc/pacman.d/*.repo 2>/dev/null | head -n 50
              exit 4
            fi
          fi
          echo "=== env/pacman DB ready ==="

      - "name": "Install ALL build deps (prefix = ${MINGW_PACKAGE_PREFIX})"
        "shell": "msys2 {0}"
        "run": |
          set -e
          PFX="$MINGW_PACKAGE_PREFIX"
          echo "[Using prefix] $PFX"

          PKGS=(
            "toolchain"
            "meson"
            "pkgconf"
            "nasm"
            "ffmpeg"
            "libass"
            "libjpeg-turbo"
            "libbluray"
            "libdvdnav"
            "libdvdread"
            "libdvdcss"
            "shaderc"
            "spirv-cross"
            "lcms2"
            "libarchive"
            "mujs"
            "vulkan-loader"
            "angle-library"
            "libplacebo"
            "vulkan-headers"
          )
          FULL_PKGS=()
          for p in "${PKGS[@]}"; do FULL_PKGS+=("${PFX}${p}"); done

          echo "=== Packages to install ==="
          printf '  %s\n' "${FULL_PKGS[@]}"
          echo "=========================="

          set +e
          pacman -S --noconfirm --needed --disable-download-timeout "${FULL_PKGS[@]}" 2>&1 | tail -n 80
          rc=$?
          set -e
          echo "[pacman -S exit code] $rc"

          # allow exit 1 from optional packages (e.g. libdvdcss not in this mirror); verify the MUST ones
          echo "=== Post-install verify: the MUST-HAVE packages ==="
          miss=0
          for p in ffmpeg libass libbluray libdvdnav libdvdread shaderc libplacebo meson pkgconf; do
            full="${PFX}${p}"
            if pacman -Qs "^${full}$" >/dev/null 2>&1; then
              echo "  OK     $full"
            else
              echo "  MISS   $full"
              miss=$((miss+1))
            fi
          done
          if [ "$miss" -gt 0 ]; then
            echo "!!! $miss mandatory packages still missing !!!"
            echo "Top search results for each missing package:"
            for p in ffmpeg libass libbluray libdvdnav libdvdread shaderc libplacebo meson pkgconf; do
              echo "--- $p ---"
              pacman -Ss "$p" 2>/dev/null | grep '^mingw32/' | head -n 5 || true
            done
            exit 3
          fi
          echo "All mandatory packages are present."
          echo ""
          pkg-config --exists libavcodec  && echo "[pkg-config] libavcodec  YES $(pkg-config --modversion libavcodec)"  || echo "[pkg-config] libavcodec  NO"
          pkg-config --exists libbluray   && echo "[pkg-config] libbluray   YES"                                  || echo "[pkg-config] libbluray   NO"
          pkg-config --exists dvdnav       && echo "[pkg-config] dvdnav       YES"                                  || echo "[pkg-config] dvdnav       NO"
          pkg-config --exists shaderc      && echo "[pkg-config] shaderc      YES"                                  || echo "[pkg-config] shaderc      NO"
          meson --version | awk '{print "[meson version] " $0}'
          which gcc && gcc --version | head -n 1 || echo "[gcc] NOT FOUND"

      - "name": "Clone mpv v0.41.0 and dump its REAL meson option names"
        "shell": "msys2 {0}"
        "run": |
          set -e
          rm -rf mpv
          git clone --depth 1 --branch v0.41.0 https://github.com/mpv-player/mpv.git mpv
          cd mpv
          echo "=== mpv tag v0.41.0; its supported meson options we care about ==="
          awk '/^option\(/ {
            match($0, /^option\(\s*"([^"]+)"/, a)
            if (a[1] != "") print a[1]
          }' meson_options.txt | grep -Ei "tls|openssl|angle|egl|pthread|win32|jpeg|sdl|libplacebo|lcms|archive|libmpv|cplayer|dvdnav|dvdread|bluray|ffmpeg|libass|lua|javascript|vulkan|iconv" | sort -u

      - "name": "Configure meson"
        "shell": "msys2 {0}"
        "run": |
          set -e
          cd mpv
          rm -rf build
          set +e
          meson setup build \
            --buildtype=release \
            --default-library=shared \
            --prefix="/mingw32" \
            -Dlibmpv=true \
            -Dcplayer=false \
            -Dtls-backend=schannel \
            -Dopenssl=disabled \
            -Diconv=enabled \
            -Ddvdnav=enabled \
            -Ddvdread=enabled \
            -Dlibbluray=enabled \
            -Dffmpeg=enabled \
            -Dlibass=enabled \
            -Dlua=disabled \
            -Djavascript=disabled \
            -Dvulkan=enabled \
            -Degl=enabled \
            -Dangle-libs=auto \
            -Djpeg=enabled \
            -Dlcms2=enabled \
            -Dlibarchive=enabled \
            -Dsdl2=disabled \
            -Dlibplacebo=auto
          rc=$?
          set -e
          if [ $rc -ne 0 ]; then
            echo "=== meson setup FAILED, tail log ==="
            if [ -f build/meson-logs/meson-log.txt ]; then tail -n 150 build/meson-logs/meson-log.txt; else echo "(no meson-log.txt)"; fi
            echo "=== True option names this mpv accepts ==="
            awk '/^option\(/ { match($0, /^option\(\s*"([^"]+)"/, a); if (a[1] != "") print a[1] }' meson_options.txt | sort -u
            exit $rc
          fi
          echo "=== meson SUCCESS, configure summary (top) ==="
          meson configure build 2>&1 | head -n 80

      - "name": "Compile"
        "shell": "msys2 {0}"
        "run": |
          set -e
          cd mpv
          cores="${NUMBER_OF_PROCESSORS:-2}"
          echo ">>> Compiling with $cores cores <<<"
          set +e
          meson compile -C build -j"$cores" 2>&1 | tail -n 60
          rc=${PIPESTATUS[0]}
          set -e
          if [ $rc -ne 0 ]; then
            echo "=== compile FAILED, last 220 verbose lines ==="
            meson compile -C build --verbose 2>&1 | tail -n 220
            exit $rc
          fi
          echo "=== Build outputs ==="
          ls -la build/libmpv* 2>/dev/null
          (ldd build/libmpv-2.dll || true) 2>/dev/null | head -n 30

      - "name": "Collect artifacts"
        "shell": "msys2 {0}"
        "run": |
          set -e
          rm -rf output
          mkdir -p output/include
          if [ ! -f mpv/build/libmpv-2.dll ]; then
            echo "!!! libmpv-2.dll not built !!!"
            ls -la mpv/build/
            exit 2
          fi
          cp mpv/build/libmpv-2.dll output/
          cp mpv/build/libmpv.dll.a output/ 2>/dev/null || true
          cp mpv/libmpv/client.h output/include/
          cp mpv/libmpv/render.h output/include/
          cp mpv/libmpv/stream_cb.h output/include/
          cd output
          if command -v ldd >/dev/null 2>&1; then
            ldd libmpv-2.dll | grep -E '/mingw|mingw32' | awk '{print $3}' | while read -r dll; do
              [ -f "$dll" ] && cp "$dll" . || true
            done
          fi
          echo "=== Final artifacts ==="
          ls -la
          echo "Total files: $(find . -type f | wc -l)"

      - "name": "Upload artifacts"
        "if": "always()"
        "uses": "actions/upload-artifact@v4"
        "with":
          "name": "libmpv-i686-v0410-schannel"
          "path": "output/"
