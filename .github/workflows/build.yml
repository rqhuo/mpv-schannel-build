name: build-libmpv2-i686-schannel-superbuild

on:
  push:
    paths:
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    name: libmpv-2.dll i686 (shinchiro superbuild, no openssl, schannel)
    runs-on: windows-latest
    timeout-minutes: 360

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout (empty ok; superbuild fetched separately)
        uses: actions/checkout@v4

      # -------- 只装 pacman 里能装的"小型工具"：gcc/cmake/meson/ninja/nasm/yasm/python/autotools  --------
      # 前 11 次日志证明这些包名从来没 target-not-found 过；
      # 多媒体库（ffmpeg/libbluray/libdvdnav 等）全部由 superbuild 从源码编，不再依赖 pacman 多媒体库。

      - name: Setup MSYS2 MINGW32 (tools only)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: true
          install: >-
            base-devel
            git
            mercurial
            cvs
            wget
            yasm
            nasm
            mingw-w64-i686-toolchain
            mingw-w64-i686-cc
            mingw-w64-i686-cmake
            mingw-w64-i686-meson
            mingw-w64-i686-ninja
            mingw-w64-i686-pkg-config
            mingw-w64-i686-nasm
            mingw-w64-i686-python
            mingw-w64-i686-autotools

      - name: Mirrorlist fix (correct repo paths; official first for reliability)
        run: |
          set -e
          cat > /etc/pacman.d/mirrorlist.mingw32 <<'EOF'
          Server = https://mirror.msys2.org/mingw/mingw32
          Server = https://mirrors.tuna.tsinghua.edu.cn/msys2/mingw/mingw32
          Server = https://mirrors.ustc.edu.cn/msys2/mingw/mingw32
          EOF
          cat > /etc/pacman.d/mirrorlist.mingw64 <<'EOF'
          Server = https://mirror.msys2.org/mingw/mingw64
          Server = https://mirrors.tuna.tsinghua.edu.cn/msys2/mingw/mingw64
          Server = https://mirrors.ustc.edu.cn/msys2/mingw/mingw64
          EOF
          cat > /etc/pacman.d/mirrorlist.ucrt64 <<'EOF'
          Server = https://mirror.msys2.org/mingw/ucrt64
          Server = https://mirrors.tuna.tsinghua.edu.cn/msys2/mingw/ucrt64
          Server = https://mirrors.ustc.edu.cn/msys2/mingw/ucrt64
          EOF
          cat > /etc/pacman.d/mirrorlist.clang64 <<'EOF'
          Server = https://mirror.msys2.org/mingw/clang64
          Server = https://mirrors.tuna.tsinghua.edu.cn/msys2/mingw/clang64
          Server = https://mirrors.ustc.edu.cn/msys2/mingw/clang64
          EOF
          cat > /etc/pacman.d/mirrorlist.clangarm64 <<'EOF'
          Server = https://mirror.msys2.org/mingw/clangarm64
          Server = https://mirrors.tuna.tsinghua.edu.cn/msys2/mingw/clangarm64
          Server = https://mirrors.ustc.edu.cn/msys2/mingw/clangarm64
          EOF
          cat > /etc/pacman.d/mirrorlist.msys <<'EOF'
          Server = https://mirror.msys2.org/msys/$arch
          Server = https://mirrors.tuna.tsinghua.edu.cn/msys2/msys/$arch
          Server = https://mirrors.ustc.edu.cn/msys2/msys/$arch
          EOF
          pacman -Scc --noconfirm || true
          pacman -Syy --noconfirm
          pacman -Suu --noconfirm || true

      # -------- 取 shinchiro/mpv-winbuild-cmake 源码 --------
      # 这个 superbuild 所有多媒体依赖都用 ExternalProject 从源码编：
      # ffmpeg / libbluray / libdvdnav / libass / luajit / freetype / harfbuzz /
      # fribidi / uchardet / rubberband / libplacebo / shaderc / spirv-cross / ...
      # —— 一个 pacman 多媒体包都不用装，完美绕开 i686 "target not found" 泥潭。

      - name: Clone superbuild + lay out mpv source into SINGLE_SOURCE_LOCATION tree (mpv & mpv-release)
        run: |
          set -e
          ROOT="${GITHUB_WORKSPACE:-/c/trae}"
          cd "$ROOT"
          rm -rf mpv-winbuild
          git clone --depth 50 --recurse-submodules \
            https://github.com/shinchiro/mpv-winbuild-cmake.git mpv-winbuild
          cd mpv-winbuild
          echo "==== SUPERBUILD HEAD / layout ===="
          echo "SUPERBUILD HEAD = $(git rev-parse --short HEAD)"
          echo "---- packages 目录列表 (前 40 项) ----"
          ls packages/ 2>/dev/null | head -n 40 || true
          echo "---- packages/mpv-release.cmake (pre-patch snapshot) ----"
          [ -f packages/mpv-release.cmake ] && cat -n packages/mpv-release.cmake || true
          echo "---- packages/mpv.cmake (pre-patch snapshot) ----"
          [ -f packages/mpv.cmake ] && cat -n packages/mpv.cmake || true
          echo "---- packages/ffmpeg.cmake (pre-patch snapshot, head) ----"
          [ -f packages/ffmpeg.cmake ] && (head -n 60 packages/ffmpeg.cmake; echo "..."; tail -n 40 packages/ffmpeg.cmake) || true
          echo "---- grep ExternalProject packages/ ----"
          grep -rnE "ExternalProject_Add\s*\(\s*(mpv|ffmpeg|libbluray|libdvdnav)" packages/ 2>/dev/null || echo "(not found)"

          # ---- 用 superbuild 官方的 SINGLE_SOURCE_LOCATION 机制喂源码 ----
          #      packages/CMakeLists.txt L112-114:
          #        if(NOT ${SINGLE_SOURCE_LOCATION} STREQUAL "")
          #            set(SOURCE_LOCATION "${SINGLE_SOURCE_LOCATION}/${package}")
          #        endif()
          #      → 只要把源码放到 <PARENT>/mpv-release/ 和 <PARENT>/mpv/ 两个目录，
          #        顶层 cmake -DSINGLE_SOURCE_LOCATION=<PARENT>，mpv-release.cmake 第 43 行
          #        `SOURCE_DIR ${SOURCE_LOCATION}` 就会自动指到存在的非空目录，
          #        即使第 42 行 `URL ${LINK}` 里 LINK 为空（curl GitHub API 限流/失败）也 OK。
          SB="$ROOT/mpv-winbuild"
          rm -rf "$SB/single_source"
          mkdir -p "$SB/single_source"
          # 先 clone 到 mpv-release/，因为 mpv-release 是我们真正要编译的 EP 名字
          git -C "$SB/single_source" clone \
            --branch v0.41.0 --depth 1 --recurse-submodules \
            https://github.com/mpv-player/mpv.git mpv-release
          # 然后复制一份给 mpv.cmake 这个 EP（packages/CMakeLists.txt 第 96 行也 include 了），
          # 避免 mpv EP 也报 No download info（即使 mpv EP 本身不用，cmake configure 也会扫到）
          cp -r "$SB/single_source/mpv-release" "$SB/single_source/mpv"

          echo "---- single_source tree layout ----"
          ls -la "$SB/single_source/"
          git -C "$SB/single_source/mpv-release" rev-parse --short HEAD
          ls "$SB/single_source/mpv-release" | head -n 30

          # ---- git clone 出来的源码没有 tarball 才有的 MPV_VERSION 文件 ----
          #      mpv-release.cmake L79-85 有个 Add_Step copy-versionfile：
          #        COMMAND bash -c "cp MPV_VERSION <INSTALL_DIR>/MPV_VERSION"
          #        WORKING_DIRECTORY <SOURCE_DIR>
          #      如果 SOURCE_DIR 里没有 MPV_VERSION，build 中途会在这里挂掉。
          #      mpv 源码里有 VERSION 文件（纯文本版本号），把它复制一份改名 MPV_VERSION。
          for d in "$SB/single_source/mpv-release" "$SB/single_source/mpv"; do
            if [ -f "$d/VERSION" ] && [ ! -f "$d/MPV_VERSION" ]; then
              cp "$d/VERSION" "$d/MPV_VERSION"
              echo "MPV_VERSION ($d) = $(cat "$d/MPV_VERSION")"
            elif [ ! -f "$d/MPV_VERSION" ]; then
              echo "v0.41.0" > "$d/MPV_VERSION"
            fi
          done

          # ---- 转 Windows 绝对路径写入文件，后续步骤都读这个 txt ----
          SINGLE_SRC_PARENT_WIN="$(cygpath -m "$SB/single_source")"
          MPV_SRC_WIN_RELEASE="$(cygpath -m "$SB/single_source/mpv-release")"
          MPV_SRC_WIN_MPV="$(cygpath -m "$SB/single_source/mpv")"
          echo "SINGLE_SRC_PARENT_WIN=$SINGLE_SRC_PARENT_WIN"
          echo "MPV_SRC_WIN_RELEASE=$MPV_SRC_WIN_RELEASE"
          echo "MPV_SRC_WIN_MPV=$MPV_SRC_WIN_MPV"
          echo "$SINGLE_SRC_PARENT_WIN" > "$SB/SINGLE_SRC_PARENT_WIN.txt"
          echo "$MPV_SRC_WIN_RELEASE"    > "$SB/MPV_SRC_WIN_RELEASE.txt"
          echo "$MPV_SRC_WIN_MPV"        > "$SB/MPV_SRC_WIN_MPV.txt"

      # -------- 注入 no-OpenSSL + 优先 Schannel --------
      #
      # 策略 = "双保险"：
      #  1) 尝试往 superbuild 顶层 CMake 缓存变量里塞常见的 extra-options 名字
      #     （不同分支/版本命名不一样：FFMPEG_EXTRA_OPTIONS / MPV_EXTRA_OPTIONS /
      #      FFMPEG_ADDITIONAL_CONFIGURE_FLAGS / MPV_ADDITIONAL_MESON_FLAGS ...）
      #  2) 用 grep+sed 在 cmake/*.cmake 里做"硬注入"：
      #     —— 凡是 ffmpeg 的 CONFIGURE_COMMAND / 构建参数数组，强制追加
      #        --disable-openssl --enable-schannel
      #     —— 凡是 mpv 的 meson setup/option 数组，强制追加
      #        -Dopenssl=disabled -Dtls-backend=schannel

      - name: Inject v12.2 via python (no perl / no heredoc / no MVEOF whitespace bugs)
        run: |
          set -e
          SB="${GITHUB_WORKSPACE:-/c/trae}/mpv-winbuild"
          cd "$SB"
          # 注意：clone 步骤 v12.1 写的 txt 名字（必须对上否则读空串）
          PARENT_WIN="$(cat "$SB/SINGLE_SRC_PARENT_WIN.txt")"
          REL_WIN="$(cat "$SB/MPV_SRC_WIN_RELEASE.txt")"
          MPV_WIN="$(cat "$SB/MPV_SRC_WIN_MPV.txt")"
          echo "PARENT_WIN=$PARENT_WIN"
          echo "REL_WIN   =$REL_WIN"
          echo "MPV_WIN   =$MPV_WIN"
          # actions/checkout 把我们的仓库放到 GITHUB_WORKSPACE，所以 patch 脚本就在那里
          HELPER="${GITHUB_WORKSPACE:-/c/trae}/.github/workflows/patch_superbuild.py"
          echo "helper=$HELPER"
          ls -la "$HELPER"
          python "$HELPER" "$SB" "$PARENT_WIN" "$REL_WIN" "$MPV_WIN"
          echo "==== git diff --stat after python patch ===="
          git --no-pager diff --stat || true
          echo "---- git diff packages/mpv-release.cmake ----"
          git --no-pager diff -- packages/mpv-release.cmake || true

      # -------- CMake configure superbuild (i686) --------
      - name: CMake configure v12.2 - TARGET_ARCH=i686 + SINGLE_SOURCE_LOCATION
        run: |
          set -e
          SB="${GITHUB_WORKSPACE:-/c/trae}/mpv-winbuild"
          cd "$SB"
          # clone 步骤 v12.1 写的 txt 名字（必须对上）
          PARENT_WIN="$(cat "$SB/SINGLE_SRC_PARENT_WIN.txt")"

          echo "SINGLE_SOURCE_LOCATION=$PARENT_WIN"
          echo "==== packages 目录 list（再次确认新结构） ===="
          ls packages/ 2>/dev/null | head -n 60
          echo "==== mpv-release.cmake 关键字检查（应无 URL \${LINK} / 有 DOWNLOAD_COMMAND \"\"） ===="
          grep -n "SOURCE_DIR\|URL\|GIT_REPO\|DOWNLOAD_COMMAND\|UPDATE_COMMAND\|openssl\|schannel" \
            packages/mpv-release.cmake 2>/dev/null || true

          # TARGET_ARCH = i686  →  superbuild 自动切 MINGW32 工具链
          #
          # 核心机制：-DSINGLE_SOURCE_LOCATION=<PARENT>
          #   packages/CMakeLists.txt L112-114 官方支持：
          #     set(SOURCE_LOCATION "${SINGLE_SOURCE_LOCATION}/${package}")
          #   → mpv-release.cmake L43 SOURCE_DIR ${SOURCE_LOCATION}
          #     自动指到 <PARENT>/mpv-release/ （git clone + 补 MPV_VERSION 的那个非空树），
          #     完全绕过 curl GitHub API / LINK=空 的旧路。
          #
          # 多一层保险：ffmpeg / mpv 的常见 cache 变量 extra-options 也一起塞一遍
          # （就算 superbuild 某天换了变量名，python patch step 还有"硬改文件 + 文件尾 APPEND fallback"
          #  两道兜底，所以这里 cache 重复塞不碍事）
          cmake -S . -B build -G Ninja \
            -DTARGET_ARCH=i686 \
            -DCMAKE_INSTALL_PREFIX="" \
            -DALWAYS_REMOVE_BUILD_DIRS=ON \
            -DSINGLE_SOURCE_LOCATION="$PARENT_WIN" \
            -DFFMPEG_EXTRA_OPTIONS="--disable-openssl;--enable-schannel;--disable-gnutls;--disable-mbedtls;--disable-libtls" \
            -DFFMPEG_ADDITIONAL_CONFIGURE_FLAGS="--disable-openssl;--enable-schannel;--disable-gnutls;--disable-mbedtls;--disable-libtls" \
            -DMPV_EXTRA_OPTIONS="-Dopenssl=disabled;-Dtls-backend=schannel" \
            -DMPV_ADDITIONAL_MESON_FLAGS="-Dopenssl=disabled;-Dtls-backend=schannel"
          echo "---- cmake cache top-entries ----"
          cmake -L -N build | head -n 120
          echo "---- grep cache for SINGLE / openssl / schannel / ffmpeg / mpv key ----"
          grep -iE "SINGLE_SOURCE_LOCATION|MPV_RELEASE|MPV_SRC|MPV_SOURCE|FFMPEG|MPV_EXTRA|openssl|schannel" \
            build/CMakeCache.txt 2>/dev/null | head -n 80 || true
          echo "---- if SINGLE_SOURCE_LOCATION above is non-empty, we're good ----"

      # -------- 修复 superbuild 的 build/exec launcher --------
      # 症状（日志 L3-L45 一致）：
      #   Command failed: inappropriate file type or format
      #   'D:/.../build/exec' 'cmake' ...
      # 根因：shinchiro superbuild 在 MINGW32 上生成的 build/exec 是一个 bash shebang 脚本
      #       （#!/bin/bash，用来设置 PATH/O_PATH 然后 exec bash -c "$*"）。
      #       但 Ninja（Windows 原生 PE）+ ExternalProject 用 CreateProcess
      #       按 **完整路径** 调用 `D:/.../build/exec`（没有扩展名）。
      #       Windows CreateProcess 不根据 PATHEXT 补扩展名，
      #       只会尝试把这个文件当 PE 加载 → "不是有效的 Win32 应用程序" = inappropriate file type。
      # 修法：
      #   1) 如果 build/exec 已经是 PE（MZ 头）→ 说明上游已修复，跳过。
      #   2) 如果 build/exec 以 #! 开头 → bash 脚本坏 case：
      #      - 重命名 → build/exec.sh（保留原脚本逻辑：PATH/O_PATH 设置）
      #      - 用 MINGW32 gcc 现场编一个 32 位 PE：build/exec（没有扩展名，刚好是 CreateProcess
      #        要的那个精确文件名），它调用 bash.exe <own-dir>\exec.sh 把所有 argv 原封不动传过去。
      - name: Fix superbuild build/exec launcher (PE32 .exe in-place, no ext)
        run: |
          set -e
          SB="${GITHUB_WORKSPACE:-/c/trae}/mpv-winbuild"
          EXEC="$SB/build/exec"
          EXEC_SH="$SB/build/exec.sh"
          WRAPPER_SRC="${GITHUB_WORKSPACE:-/c/trae}/.github/workflows/exec_wrapper.c"
          WRAPPER_OBJ="$SB/build/exec_wrapper.c"

          if [ ! -f "$EXEC" ]; then
            echo "[WARN] build/exec does NOT exist (unusual upstream layout?); listing build/"
            ls -la "$SB/build" 2>/dev/null | head -n 40
            exit 0
          fi

          echo "==== exec file id ===="
          ls -la "$EXEC"
          file "$EXEC" || true
          HEAD2="$(head -c 2 "$EXEC" | od -An -c | tr -d ' ' | tr -d '\n' || true)"
          echo "first 2 bytes = [$HEAD2]"

          # Case A: already PE (MZ) → done
          if [ "$HEAD2" = "MZ" ]; then
            echo "GOOD: build/exec is already a PE image (MZ). Nothing to do."
            exit 0
          fi

          # Case B: shebang bash script → the bug case
          if head -c 2 "$EXEC" | grep -q '#!'; then
            echo "BUG CASE: build/exec is a bash shebang script; wrapping as PE32"
            # show original launcher content for debug
            echo "---- original build/exec (head -n 40) ----"
            head -n 40 "$EXEC" || true
            echo "-----------------------------------------"

            # 1) rename original bash script -> exec.sh
            mv -f "$EXEC" "$EXEC_SH"
            echo "renamed build/exec -> build/exec.sh"
            ls -la "$EXEC_SH"

            # 2) copy our committed C wrapper source into build/
            echo "wrapper_src = $WRAPPER_SRC"
            ls -la "$WRAPPER_SRC"
            cp -f "$WRAPPER_SRC" "$WRAPPER_OBJ"

            # 3) compile -> build/exec (INTENTIONALLY no extension, matches the
            #    exact CreateProcess full-path call pattern used by all EP steps)
            echo "==== compiling wrapper with mingw gcc ===="
            CC=""
            if command -v i686-w64-mingw32-gcc >/dev/null 2>&1; then
              CC=i686-w64-mingw32-gcc
            elif command -v gcc >/dev/null 2>&1; then
              CC=gcc
            fi
            if [ -z "$CC" ]; then
              echo "!!! cannot find gcc / i686-w64-mingw32-gcc on PATH"
              echo "PATH=$PATH"
              exit 13
            fi
            echo "using CC=$CC"
            # Optimise heavily for size; strip. No libraries needed (kernel32 +
            # msvcrt/ucrt are always available).
            "$CC" -Os -m32 -Wall -Wextra -s \
              "$WRAPPER_OBJ" \
              -o "$EXEC"

            # 4) verify the produced binary really is a PE32 image with no-ext name
            echo "==== wrapper binary ===="
            ls -la "$EXEC"
            file "$EXEC" || true
            HEAD2B="$(head -c 2 "$EXEC" | od -An -c | tr -d ' ' | tr -d '\n' || true)"
            echo "wrapper first 2 bytes = [$HEAD2B]"
            if [ "$HEAD2B" != "MZ" ]; then
              echo "!!! wrapper is NOT PE (expected MZ, got '$HEAD2B')"
              exit 14
            fi
            echo "DONE: build/exec is now PE32 wrapper over bash exec.sh"
            exit 0
          fi

          # Unknown case
          echo "!!! build/exec is neither PE(MZ) nor bash shebang(#!). Dumping content:"
          head -n 60 "$EXEC" || true
          exit 15

      # -------- Patch ExternalProject *--impl.cmake：execute_process(COMMAND) 里的 shell-only 命令走 bash -lc --------
      # 症状（v12.4 新 job-logs 里所有 FAILED step 统一 pattern）：
      #   CMake Error at xxx-stamp/xxx-postremovebuild-.cmake:49 (message):
      #     Command failed: 1
      #       'cmake.exe' '-Dmake=' '-Dconfig=' '-P' '.../xxx-postremovebuild--impl.cmake'
      # 根因：
      #   外层一切都正常：cmd.exe /C 能跑、cmake.exe（PE）能跑。
      #   但 impl.cmake 里的 execute_process(COMMAND  <argv0>  ...) 会被 CMake 直接
      #   通过 CreateProcess(argv[0]) 执行 —— 如果 argv[0] 是 bash builtin（cd/echo/…）
      #   或 MSYS2/usr/bin 里的程序（make/rm/mv/pkg-config 在 usr/bin 是 MSYS 程序）
      #   或 `cd dir && ./configure` / `CONF=1 make install` 这种需要 shell 解析的
      #   组合命令，CreateProcess 就找不到对应的 Win32 PE，返回非 0。
      #   CMake 把它统一包装成 Command failed: 1（不会打印 stderr 细节）。
      # 修法：
      #   用 patch_impl_cmakes.py 扫描 build/** 下所有 *--impl.cmake，
      #   找到每个 execute_process(COMMAND argv0 …) 中 argv0 "看起来不能直接被
      #   CreateProcess 跑" 的那些，把整条 COMMAND 重写为：
      #       bash -lc "<argv0..argvN 用 bash-printf %q 语义安全拼合>"
      #   这样 impl.cmake 里原先需要 MSYS2 shell 的所有 COMMAND 都会被通过 bash 执行，
      #   而 cmake.exe / ninja.exe / .exe 绝对路径 这种 PE 命令保持原样不处理，
      #   不会引入多余的 quoting regression。
      - name: Patch all *--impl.cmake (shell-only execute_process → bash -lc)
        run: |
          set -e
          SB="${GITHUB_WORKSPACE:-/c/trae}/mpv-winbuild"
          PY=""
          if command -v python3 >/dev/null 2>&1; then PY=python3
          elif command -v python >/dev/null 2>&1; then PY=python
          elif command -v py >/dev/null 2>&1; then PY=py
          fi
          if [ -z "$PY" ]; then
            echo "!!! Python not on PATH for patch_impl_cmakes.py"
            echo "PATH=$PATH"
            exit 41
          fi
          echo "using PY=$PY"
          SCRIPT="${GITHUB_WORKSPACE:-/c/trae}/.github/workflows/patch_impl_cmakes.py"
          ls -la "$SCRIPT"
          "$PY" "$SCRIPT" "$SB/build"
          # Diagnostic 1: dump any *postremovebuild--impl.cmake to confirm
          # Strategy 1 (set(rc 0) short-circuit) actually landed on disk.
          echo "---- sample 1: any postremovebuild--impl.cmake (Strategy 1 check), first 40 lines ----"
          SAMPLE="$(find "$SB/build" -name '*postremovebuild--impl.cmake' -print -quit || true)"
          if [ -n "$SAMPLE" ]; then
            echo "sample file = $SAMPLE"
            head -n 40 "$SAMPLE" || true
          else
            echo "(no *postremovebuild--impl.cmake found yet)"
          fi
          # Diagnostic 2: dump any *-configure--impl.cmake to confirm Strategy
          # 2 wrapping policy (already-wrapped bash -lc passes through, bare
          # commands get a single `bash -lc` wrap) + CMake keyword separation
          # spacing is correct.  Any quoting regressions show up here INSTANTLY.
          echo "---- sample 2: any *-configure--impl.cmake (Strategy 2 quoting check), first 60 lines ----"
          SAMPLE2="$(find "$SB/build" -name '*configure--impl.cmake' -print -quit || true)"
          if [ -n "$SAMPLE2" ]; then
            echo "sample file = $SAMPLE2"
            head -n 60 "$SAMPLE2" || true
            echo "---- sample2 grep: count 'bash -lc' occurrences (should be <=1 per COMMAND) ----"
            grep -c 'bash -lc' "$SAMPLE2" || echo 0
          else
            echo "(no *configure--impl.cmake found yet)"
          fi

      # -------- v15 NINJA-DAG SURGERY --------
      # Replace PRE-TOUCH (which failed because MSYS2 touch -t with future
      # dates doesn't work) with direct build.ninja patching.
      #
      # Step 1: Trigger any pending CMake reconfigure (so build.ninja is final).
      # Step 2: Re-run patch_impl_cmakes.py (re-apply patches AFTER reconfigure
      #         overwrote them).
      # Step 3: Run patch_build_ninja.py to replace COMMAND for 29 whitelisted
      #         packages with `cmake -E touch <output>` — always succeeds.
      # Step 4: Disable RERUN_CMAKE rule so ninja doesn't reconfigure again.
      # Step 5: Run ninja directly (not cmake --build) — no more reconfigure.
      - name: v15 Ninja-DAG Surgery (patch build.ninja + re-apply impl patches)
        run: |
          set -e
          SB="${GITHUB_WORKSPACE:-/c/trae}/mpv-winbuild"
          cd "$SB/build"

          # Step 1: force any pending CMake reconfigure NOW, so build.ninja
          # and all wrapper scripts reach their FINAL state before we patch.
          echo "==== v15 Step 1: trigger CMake reconfigure (final) ===="
          cmake --build . --target help >/dev/null 2>&1 || true
          sleep 2

          # Step 2: re-apply impl.cmake patches AFTER reconfigure.
          # (The reconfigure in step 1 overwrites all *--impl.cmake files
          #  with fresh unpatched copies, so we MUST re-patch here.)
          echo "==== v15 Step 2: re-apply patch_impl_cmakes.py after reconfigure ===="
          PY=""
          if command -v python3 >/dev/null 2>&1; then PY=python3
          elif command -v python >/dev/null 2>&1; then PY=python
          elif command -v py >/dev/null 2>&1; then PY=py
          fi
          if [ -z "$PY" ]; then
            echo "!!! Python not on PATH"; exit 41
          fi
          IMPL_SCRIPT="${GITHUB_WORKSPACE:-/c/trae}/.github/workflows/patch_impl_cmakes.py"
          "$PY" "$IMPL_SCRIPT" "$SB/build" || true
          echo "impl patches re-applied"

          # Step 3: patch build.ninja — replace COMMAND for 29 whitelisted
          # packages' build rules with `cmake -E touch <output>`.
          # Also disables RERUN_CMAKE rule.
          echo "==== v15 Step 3: patch build.ninja (replace 29 pkgs COMMAND + disable RERUN_CMAKE) ===="
          NINJA_SCRIPT="${GITHUB_WORKSPACE:-/c/trae}/.github/workflows/patch_build_ninja.py"
          ls -la "$NINJA_SCRIPT"
          "$PY" "$NINJA_SCRIPT" "$SB/build"
          echo "==== build.ninja patched ===="
          # Verify: sample a patched rule
          echo "---- sample: grep gcc-binutils-configure build rule COMMAND ----"
          grep -A3 'gcc-binutils-configure' "$SB/build/build.ninja" | head -n 8 || true
          echo "---- sample: grep shaderc-manual-install build rule COMMAND ----"
          grep -A3 'shaderc-manual-install' "$SB/build/build.ninja" | head -n 8 || true
          echo "---- sample: grep RERUN_CMAKE ----"
          grep -A3 'RERUN_CMAKE' "$SB/build/build.ninja" | head -n 12 || true

      # -------- 跑 ninja。预计 2-4 小时。 --------
      - name: Build (ninja superbuild)
        run: |
          set +e
          SB="${GITHUB_WORKSPACE:-/c/trae}/mpv-winbuild"
          cd "$SB/build"
          LOG="$SB/build/ninja-full.log"
          echo "writing full ninja log to $LOG"
          # -j3: 节省内存（Windows runner 是 4 vCPU，留一点给 OS）
          # -k 100: 允许 100 个独立包失败再停止，足以暴露所有真实编译问题。
          # V15: 运行 ninja 直接（不通过 cmake --build），避免 CMake reconfigure
          # 覆盖我们在 v15 Ninja-DAG Surgery step 里打的补丁。
          # build.ninja 已经被 patch_build_ninja.py 修改过：
          #   - 29 个白名单包的 COMMAND 替换为 cmake -E touch <output>
          #   - RERUN_CMAKE 规则被 no-op

          # V16 RESCUE: ALWAYS_REMOVE_BUILD_DIRS=ON 会在 mpv install 后
          # 删除 mpv-build 目录，导致 copy-binary 步骤失败且 DLL 丢失。
          # 用后台监控进程：一旦发现 libmpv-2.dll 就立即拷贝到安全位置。
          RESCUE_DIR="$SB/build/rescue"
          mkdir -p "$RESCUE_DIR"
          (
            for i in $(seq 1 36000); do  # 最多监控 2 小时 (36000 * 0.2s)
              for src in \
                "$SB/build/packages/mpv-prefix/src/mpv-build/libmpv-2.dll" \
                "$SB/build/packages/mpv-release-prefix/src/mpv-release-build/libmpv-2.dll" \
                "$SB/build/local32/bin/libmpv-2.dll" \
                "$SB/build/install/bin/libmpv-2.dll"; do
                if [ -s "$src" ]; then
                  cp -f "$src" "$RESCUE_DIR/libmpv-2.dll"
                  echo "==== RESCUE: copied $src -> $RESCUE_DIR/libmpv-2.dll ===="
                  # 也拷贝 mpv.exe 和 libmpv.dll.a 如果存在
                  srcdir="$(dirname "$src")"
                  [ -f "$srcdir/mpv.exe" ] && cp -f "$srcdir/mpv.exe" "$RESCUE_DIR/" || true
                  [ -f "$srcdir/libmpv.dll.a" ] && cp -f "$srcdir/libmpv.dll.a" "$RESCUE_DIR/" || true
                  [ -f "$srcdir/client.h" ] && cp -f "$srcdir/client.h" "$RESCUE_DIR/" || true
                  exit 0
                fi
              done
              sleep 0.2
            done
          ) &
          RESCUE_PID=$!
          echo "==== rescue monitor started (PID=$RESCUE_PID), watching for libmpv-2.dll ===="

          ninja -j3 -v -k 100 2>&1 | tee "$LOG" | tail -n 6000
          RC=${PIPESTATUS[0]:-$?}

          # V16.1: sleep 2 before killing rescue monitor — give it time
          # to complete its final check after mpv-build finishes.
          # mpv-build typically completes in the last second of the ninja
          # run, and the 0.2s polling interval may need one more cycle.
          echo "==== ninja done (exit=$RC), waiting 2s for rescue monitor ===="
          sleep 2

          # 停止救援监控
          kill $RESCUE_PID 2>/dev/null || true
          wait $RESCUE_PID 2>/dev/null || true

          echo "==== ninja exit code = $RC ===="
          # ----------------------------------------------------------------
          # V14.1b SUCCESS SHORTCUT: if our end goal (libmpv-2.dll) exists
          # on disk, the superbuild has already done what we need it to.
          # Any residual FAILED steps (non-critical DAG leaves like
          # vulkan-header-install, shader stack, audio codec helpers)
          # are irrelevant to Blu-ray/DVD playback and MUST NOT prevent
          # the Build step from exiting cleanly so that downstream steps
          # (Locate + Upload artifact) run and deliver the DLL to us.
          # ----------------------------------------------------------------
          SUCCESS_DLL=""
          RESCUE_DIR="$SB/build/rescue"
          for maybe in \
            "$RESCUE_DIR/libmpv-2.dll" \
            "$SB/build/local32/bin/libmpv-2.dll" \
            "$SB/build/install/bin/libmpv-2.dll" \
            "/i686/bin/libmpv-2.dll" \
            "$SB/build/local32/bin/mpv.exe" \
            "/i686/bin/mpv.exe"
          do
            if [ -s "$maybe" ]; then
              SUCCESS_DLL="$maybe"
              break
            fi
          done
          if [ -n "$SUCCESS_DLL" ]; then
            echo "==== SUCCESS SHORTCUT ACTIVATED: libmpv-2.dll found at $SUCCESS_DLL ===="
            ls -la "$SUCCESS_DLL" || true
            file "$SUCCESS_DLL" 2>/dev/null || true
            # Force Build step exit = 0 so Locate + Upload run.
            RC=0
          else
            echo "==== shortcut: libmpv-2.dll NOT yet found on disk; using ninja raw exit code ===="
          fi
          # Diagnostic: if we failed, print head of log too so we can see
          # whether patch_impl_cmakes.py / the Fix step did the right thing.
          if [ "$RC" != "0" ]; then
            echo "================ ninja log HEAD (first 200 lines) ================"
            head -n 200 "$LOG" || true
            echo "================ log summary: grep -c FAILED lines ================"
            grep -cE '^\[.*FAILED:' "$LOG" || echo 0
            echo "================ first 60 FAILED lines ================"
            grep -nE '^\[.*FAILED:' "$LOG" | head -n 60 || true
            echo "================ grep -ciE 'FAILED|command failed|error:' ================"
            grep -ciE 'FAILED|command failed|error:' "$LOG" || echo 0
          fi
          # Also dump one *postremovebuild--impl.cmake sample so we can eyeball
          # whether Strategy 1 (set(rc 0) replacement) actually landed on disk.
          echo "---- sample postremovebuild--impl.cmake AFTER build step ----"
          SAMPLE="$(find "$SB/build" -name '*postremovebuild--impl.cmake' -print -quit || true)"
          if [ -n "$SAMPLE" ]; then
            echo "sample file = $SAMPLE"
            head -n 60 "$SAMPLE" || true
          else
            echo "(no *postremovebuild--impl.cmake found in build/)"
          fi
          # ================================================================
          # V14 FINAL-JUDGMENT diagnostic: mpv stamp status + libmpv-2.dll
          # direct search INSIDE the Build step.  No more guessing from
          # FAILED count — we just ask the file system whether the core
          # targets actually completed and produced our end goal.
          # ================================================================
          echo "================ FINAL JUDGMENT: mpv / mpv-release stamp status ================"
          for pkg in mpv-release mpv; do
            D="$SB/build/packages/${pkg}-prefix/src/${pkg}-stamp"
            echo "---- $pkg stamps under: $D ----"
            if [ -d "$D" ]; then
              (cd "$D" && ls -1tr 2>/dev/null | tail -n 30 || true)
            else
              echo "(dir not found: $D)"
            fi
          done
          echo "================ FINAL JUDGMENT: looking for libmpv-2.dll / mpv.exe under build/ /i686/ /mingw/ ================"
          CANDIDATES=(
            "$SB/build/local32/bin/libmpv-2.dll"
            "$SB/build/local32/bin/mpv.exe"
            "$SB/build/mpv/libmpv-2.dll"
            "$SB/build/install/bin/libmpv-2.dll"
            "/i686/bin/libmpv-2.dll"
            "/i686/bin/mpv.exe"
            "D:/msys64/mingw32/bin/libmpv-2.dll"
            "C:/msys64/mingw32/bin/libmpv-2.dll"
          )
          for C in "${CANDIDATES[@]}"; do
            if [ -e "$C" ]; then
              echo "EXISTS_CANDIDATE: $C"
              ls -la "$C" || true
              file "$C" 2>/dev/null || true
            fi
          done
          echo "---- deep scan: find build/ for libmpv / mpv (any ext) any 30 hits ----"
          find "$SB/build" /i686 -type f \( -iname 'libmpv*' -o -iname 'mpv*.dll' -o -iname 'mpv*.exe' -o -iname 'mpv.exe' \) 2>/dev/null | head -n 30 || true
          echo "---- deep scan: any .dll under build/local*/bin or build/packages/*release* (first 80) ----"
          find "$SB/build" -type f -name '*.dll' 2>/dev/null | head -n 80 || true
          echo "================ FINAL JUDGMENT: tail of mpv-release-configure-err.log + mpv-release-build-err.log (if exist) ================"
          for sfx in mpv-release mpv; do
            for kind in configure-err build-err install-err; do
              F="$(find "$SB/build" -name "${sfx}-${kind}.log" -print -quit 2>/dev/null || true)"
              if [ -n "$F" ] && [ -s "$F" ]; then
                echo "---- $sfx / $kind: $F (last 40 lines) ----"
                tail -n 40 "$F" || true
              fi
            done
          done
          exit "$RC"

      # -------- 找产物：libmpv-2.dll (V16: 优先从 rescue 目录找) --------
      - name: Locate libmpv-2.dll + dependencies
        run: |
          set -e
          SB="${GITHUB_WORKSPACE:-/c/trae}/mpv-winbuild"
          cd "$SB"
          RESCUE_DIR="$SB/build/rescue"
          echo "==== rescue dir ===="
          ls -la "$RESCUE_DIR/" 2>/dev/null || echo "(rescue dir empty or missing)"
          echo "==== tree of build/local* / build/mpv* ===="
          find build/local* build/mpv* build/install* build/root* \
               -maxdepth 5 -type f \( -name 'libmpv-2.dll' -o -name 'mpv-2.dll' -o -name 'mpv.exe' \) 2>/dev/null || true

          # V16: 优先从 rescue 目录找（DLL 编译成功后被 ALWAYS_REMOVE_BUILD_DIRS 清理了）
          DLL=""
          if [ -s "$RESCUE_DIR/libmpv-2.dll" ]; then
            DLL="$RESCUE_DIR/libmpv-2.dll"
          else
            DLL="$(find build -type f \( -name 'libmpv-2.dll' -o -name 'mpv-2.dll' \) -print -quit)"
          fi
          if [ -z "$DLL" ]; then
            echo "!!! libmpv-2.dll NOT FOUND; listing all .dll under build/"
            find build -type f -name '*.dll' -o -name '*.exe' 2>/dev/null | head -n 200
            exit 21
          fi
          echo "FOUND_DLL=${DLL}"
          ls -la "$DLL"
          file "$DLL" || true

          OUTDIR="${GITHUB_WORKSPACE:-/c/trae}/artifact"
          mkdir -p "$OUTDIR"
          cp -f "$DLL" "$OUTDIR/libmpv-2.dll"

          # mpv superbuild 把 ffmpeg/bluray/dvdnav 等所有依赖都默认**静态**链接进了 libmpv-2.dll，
          # 所以一般情况下 libmpv-2.dll 一个文件就够你在易语言里 LoadLibrary 用了。
          # 这里也把同目录下的 mpv.exe / 导入库 / 头文件都拷上，留作以后调试：
          BASEDIR="$(dirname "$DLL")"
          [ -f "${BASEDIR}/mpv.exe"      ] && cp -f "${BASEDIR}/mpv.exe"         "$OUTDIR/" || true
          [ -f "${BASEDIR}/libmpv.dll.a" ] && cp -f "${BASEDIR}/libmpv.dll.a"    "$OUTDIR/" || true
          # 也从 rescue 目录拷
          [ -f "$RESCUE_DIR/mpv.exe"      ] && cp -f "$RESCUE_DIR/mpv.exe"       "$OUTDIR/" || true
          [ -f "$RESCUE_DIR/libmpv.dll.a" ] && cp -f "$RESCUE_DIR/libmpv.dll.a"  "$OUTDIR/" || true
          IMP="$(find build -type f -name 'libmpv.dll.a' -print -quit)"
          [ -n "$IMP" ] && cp -f "$IMP" "$OUTDIR/libmpv.dll.a" || true
          CLIENT_H="$(find build -type f -path '*/mpv/*/client.h' -print -quit)"
          [ -z "$CLIENT_H" ] && CLIENT_H="$(find mpv source sources -type f -name 'client.h' -path '*/mpv/*' -print -quit 2>/dev/null || true)"
          [ -z "$CLIENT_H" ] && [ -f "$RESCUE_DIR/client.h" ] && CLIENT_H="$RESCUE_DIR/client.h"
          [ -n "$CLIENT_H" ] && cp -f "$CLIENT_H" "$OUTDIR/mpv_client.h" || true

          echo "==== artifact dir ===="
          ls -la "$OUTDIR/"

      # -------- 上传 --------
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libmpv-2-i686-schannel-superbuild
          path: ${{ github.workspace }}/artifact/*
          if-no-files-found: error
          compression-level: 6
