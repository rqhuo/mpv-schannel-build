name: build-libmpv2-i686-schannel-superbuild

on:
  push:
    paths:
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    name: libmpv-2.dll i686 (shinchiro superbuild, no openssl, schannel)
    runs-on: windows-latest
    timeout-minutes: 360

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout (empty ok; superbuild fetched separately)
        uses: actions/checkout@v4

      # -------- 只装 pacman 里能装的"小型工具"：gcc/cmake/meson/ninja/nasm/yasm/python/autotools  --------
      # 前 11 次日志证明这些包名从来没 target-not-found 过；
      # 多媒体库（ffmpeg/libbluray/libdvdnav 等）全部由 superbuild 从源码编，不再依赖 pacman 多媒体库。

      - name: Setup MSYS2 MINGW32 (tools only)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: true
          install: >-
            base-devel
            git
            mercurial
            cvs
            wget
            yasm
            nasm
            mingw-w64-i686-toolchain
            mingw-w64-i686-cc
            mingw-w64-i686-cmake
            mingw-w64-i686-meson
            mingw-w64-i686-ninja
            mingw-w64-i686-pkg-config
            mingw-w64-i686-nasm
            mingw-w64-i686-python
            mingw-w64-i686-autotools

      - name: Mirrorlist fix (correct repo paths; official first for reliability)
        run: |
          set -e
          cat > /etc/pacman.d/mirrorlist.mingw32 <<'EOF'
          Server = https://mirror.msys2.org/mingw/mingw32
          Server = https://mirrors.tuna.tsinghua.edu.cn/msys2/mingw/mingw32
          Server = https://mirrors.ustc.edu.cn/msys2/mingw/mingw32
          EOF
          cat > /etc/pacman.d/mirrorlist.mingw64 <<'EOF'
          Server = https://mirror.msys2.org/mingw/mingw64
          Server = https://mirrors.tuna.tsinghua.edu.cn/msys2/mingw/mingw64
          Server = https://mirrors.ustc.edu.cn/msys2/mingw/mingw64
          EOF
          cat > /etc/pacman.d/mirrorlist.ucrt64 <<'EOF'
          Server = https://mirror.msys2.org/mingw/ucrt64
          Server = https://mirrors.tuna.tsinghua.edu.cn/msys2/mingw/ucrt64
          Server = https://mirrors.ustc.edu.cn/msys2/mingw/ucrt64
          EOF
          cat > /etc/pacman.d/mirrorlist.clang64 <<'EOF'
          Server = https://mirror.msys2.org/mingw/clang64
          Server = https://mirrors.tuna.tsinghua.edu.cn/msys2/mingw/clang64
          Server = https://mirrors.ustc.edu.cn/msys2/mingw/clang64
          EOF
          cat > /etc/pacman.d/mirrorlist.clangarm64 <<'EOF'
          Server = https://mirror.msys2.org/mingw/clangarm64
          Server = https://mirrors.tuna.tsinghua.edu.cn/msys2/mingw/clangarm64
          Server = https://mirrors.ustc.edu.cn/msys2/mingw/clangarm64
          EOF
          cat > /etc/pacman.d/mirrorlist.msys <<'EOF'
          Server = https://mirror.msys2.org/msys/$arch
          Server = https://mirrors.tuna.tsinghua.edu.cn/msys2/msys/$arch
          Server = https://mirrors.ustc.edu.cn/msys2/msys/$arch
          EOF
          pacman -Scc --noconfirm || true
          pacman -Syy --noconfirm
          pacman -Suu --noconfirm || true

      # -------- 取 shinchiro/mpv-winbuild-cmake 源码 --------
      # 这个 superbuild 所有多媒体依赖都用 ExternalProject 从源码编：
      # ffmpeg / libbluray / libdvdnav / libass / luajit / freetype / harfbuzz /
      # fribidi / uchardet / rubberband / libplacebo / shaderc / spirv-cross / ...
      # —— 一个 pacman 多媒体包都不用装，完美绕开 i686 "target not found" 泥潭。

      - name: Clone shinchiro mpv-winbuild-cmake + clone mpv v0.41.0 source (for mpv-release)
        run: |
          set -e
          ROOT="${GITHUB_WORKSPACE:-/c/trae}"
          cd "$ROOT"
          rm -rf mpv-winbuild
          git clone --depth 50 --recurse-submodules \
            https://github.com/shinchiro/mpv-winbuild-cmake.git mpv-winbuild
          cd mpv-winbuild
          echo "==== SUPERBUILD HEAD / layout ===="
          echo "SUPERBUILD HEAD = $(git rev-parse --short HEAD)"
          ls -la
          echo "---- cmake/ ----"
          ls cmake/ 2>/dev/null || true
          echo "---- packages/ (new layout) ----"
          ls packages/ 2>/dev/null || true
          echo "---- packages/mpv-release.cmake (stack says this is line-16 EP fail) ----"
          [ -f packages/mpv-release.cmake ] && cat -n packages/mpv-release.cmake || true
          echo "---- packages/CMakeLists.txt ----"
          [ -f packages/CMakeLists.txt ] && cat -n packages/CMakeLists.txt || true
          echo "---- grep ExternalProject packages/ ----"
          grep -rnE "ExternalProject_Add\s*\(\s*(mpv|ffmpeg|libbluray|libdvdnav)" packages/ 2>/dev/null || echo "(not found)"

          # ---- 单独在 $SB/src/mpv 放一份 mpv v0.41.0 源码 ----
          #      新版 superbuild 的 mpv-release ExternalProject 不给 URL/GIT，
          #      需要外部提供 SOURCE_DIR；用本地源码直接塞给它，彻底绕开下载阶段。
          SB="$ROOT/mpv-winbuild"
          mkdir -p "$SB/src"
          rm -rf "$SB/src/mpv"
          git -C "$SB/src" clone \
            --branch v0.41.0 --depth 1 --recurse-submodules \
            https://github.com/mpv-player/mpv.git mpv
          git -C "$SB/src/mpv" rev-parse --short HEAD
          ls -la "$SB/src/mpv" | head -n 20

          # ---- msys2 路径转 Windows 绝对路径，给 ExternalProject SOURCE_DIR 使用 ----
          #      ExternalProject + cmake -E 对 msys 风格 /c/xxx 有时会误判成相对路径，
          #      用 cygpath -m 换成 C:/xxx/... 更稳。
          MPV_SRC_WIN="$(cygpath -m "$SB/src/mpv")"
          echo "MPV_SRC_MINGW=$SB/src/mpv"
          echo "MPV_SRC_WIN=$MPV_SRC_WIN"
          echo "$MPV_SRC_WIN" > "$SB/MPV_SRC_WIN.txt"

      # -------- 注入 no-OpenSSL + 优先 Schannel --------
      #
      # 策略 = "双保险"：
      #  1) 尝试往 superbuild 顶层 CMake 缓存变量里塞常见的 extra-options 名字
      #     （不同分支/版本命名不一样：FFMPEG_EXTRA_OPTIONS / MPV_EXTRA_OPTIONS /
      #      FFMPEG_ADDITIONAL_CONFIGURE_FLAGS / MPV_ADDITIONAL_MESON_FLAGS ...）
      #  2) 用 grep+sed 在 cmake/*.cmake 里做"硬注入"：
      #     —— 凡是 ffmpeg 的 CONFIGURE_COMMAND / 构建参数数组，强制追加
      #        --disable-openssl --enable-schannel
      #     —— 凡是 mpv 的 meson setup/option 数组，强制追加
      #        -Dopenssl=disabled -Dtls-backend=schannel

      - name: Hard-patch mpv-release SOURCE_DIR + no-openssl/schannel (packages/ + cmake/)
        run: |
          set -e
          SB="${GITHUB_WORKSPACE:-/c/trae}/mpv-winbuild"
          cd "$SB"
          MPV_SRC_WIN="$(cat "$SB/MPV_SRC_WIN.txt")"
          echo "MPV_SRC_WIN=$MPV_SRC_WIN"

          echo "==== 1) mpv-release.cmake: 强制塞 SOURCE_DIR（根治 no-download-info 报错） ===="
          F=packages/mpv-release.cmake
          if [ -f "$F" ]; then
            echo "-- pre-inject $F --"
            cat -n "$F"
            # 方法A: 在 ExternalProject_Add(mpv-release 或 mpv) 后面紧跟的位置插入 SOURCE_DIR
            #        正则匹配整个 ExternalProject_Add(...)\) 块，在 CONFIGURE_COMMAND/任何关键字参数之前或
            #        紧贴 mpv-release 后插入 SOURCE_DIR "${MPV_SRC_WIN}"。
            perl -i -0pe \
              's/(ExternalProject_Add\s*\(\s*mpv(?:-release)?\b)/$1\n  SOURCE_DIR "'"$MPV_SRC_WIN"'"\n  UPDATE_COMMAND ""\n  PATCH_COMMAND ""/sgi' \
              "$F" || true
            # 方法B: 兜底 sed: 找到 ExternalProject_Add 行后在第 2 行单独插入 SOURCE_DIR
            if ! grep -q "SOURCE_DIR" "$F"; then
              sed -i -E "0,/(ExternalProject_Add\s*\(\s*mpv)/s//ExternalProject_Add_SOURCES_HACK\nSOURCE_DIR \"$MPV_SRC_WIN\"\nUPDATE_COMMAND \"\"\nPATCH_COMMAND \"\"\n\0/" "$F" 2>/dev/null \
                || sed -i "1a if(1) endif()\n# nothing" "$F" >/dev/null 2>&1 || true
            fi
            # 方法C: 再狠一点：如果 ExternalProject_Add 中仍然没 SOURCE_DIR，就手工 append 到括号内
            if ! grep -q "SOURCE_DIR" "$F"; then
              # 在紧挨着的 ")" 结束 ExternalProject_Add 的前一行前插入
              perl -i -0pe \
                's/(ExternalProject_Add\s*\(\s*mpv(?:-release)?\b.*?)(\s*\)\s*)$/$1\n  SOURCE_DIR "'"$MPV_SRC_WIN"'"\n  UPDATE_COMMAND ""\n  PATCH_COMMAND ""\n$2/sgi' "$F" || true
            fi
            echo "-- post-inject $F --"
            cat -n "$F"
          else
            echo "[WARN] packages/mpv-release.cmake not found; trying legacy mpv.cmake paths"
            ls packages/ cmake/ 2>/dev/null
            find . -name '*mpv*.cmake' -print 2>/dev/null
          fi

          echo "==== 2) 搜索范围 = packages/ + cmake/ + CMakeLists.txt（新版 superbuild 脚本在 packages/） ===="
          SEARCH_DIRS="packages cmake ."
          CMAKE_FILES="$(find $SEARCH_DIRS -type f \( -name '*.cmake' -o -name 'CMakeLists.txt' \) 2>/dev/null | tr '\n' ' ')"
          echo "CMake files under scan: $CMAKE_FILES"
          grep -rlE "ExternalProject_Add\s*\(\s*(ffmpeg|libbluray|libdvdnav|mpv)" packages cmake . 2>/dev/null || true

          echo "==== 3) ffmpeg: 追加 --disable-openssl --enable-schannel --disable-gnutls ===="

          # 3A: 直接改 ExternalProject_Add(ffmpeg ... CONFIGURE_COMMAND ...) 结尾
          for f in $(grep -rlE "ExternalProject_Add\s*\(\s*ffmpeg" packages cmake . 2>/dev/null); do
            echo "-- patch ffmpeg EP in: $f"
            perl -i -0pe \
              's/(ExternalProject_Add\s*\(\s*ffmpeg\b.*?CONFIGURE_COMMAND\s+.*?)(\s*\)\s*)$/$1 --disable-openssl --enable-schannel --disable-gnutls --disable-libtls --disable-mbedtls $2/si' "$f" \
              || echo "   perl-skip-1: $f"
          done

          # 3B: 兜底 sed: 在 ffmpeg 的任何 CONFIGURE_ARGS 数组中追加
          for f in $CMAKE_FILES; do
            [ -f "$f" ] || continue
            if grep -qiE "ffmpeg" "$f" && ! grep -q "DISABLE_OPENSSL_INJECTED" "$f"; then
              cat >> "$f" <<'FFEOF'

              # --- BEGIN: INJECTED by CI [DISABLE_OPENSSL_INJECTED] ---
              if(COMMAND list)
                foreach(_v IN ITEMS
                    FFMPEG_CONFIGURE_ARGS              ffmpeg_CONFIGURE_ARGS
                    FFMPEG_OPTIONS                     ffmpeg_OPTIONS
                    FFMPEG_EXTRA_OPTIONS               ffmpeg_EXTRA_OPTIONS
                    FFMPEG_ADDITIONAL_CONFIGURE_FLAGS  ffmpeg_ADDITIONAL_CONFIGURE_FLAGS
                    FFMPEG_CONFIGURE_EXTRA_FLAGS       ffmpeg_CONFIGURE_EXTRA_FLAGS
                    FFMPEG_EXTRA_CONFIGURE_ARGS        ffmpeg_EXTRA_CONFIGURE_ARGS
                    FFMPEG_EXTRA                       ffmpeg_EXTRA)
                  if(DEFINED ${_v})
                    list(APPEND ${_v}
                      "--disable-openssl"
                      "--enable-schannel"
                      "--disable-gnutls"
                      "--disable-mbedtls"
                      "--disable-libtls")
                    set(${_v} "${${_v}}" CACHE INTERNAL "" FORCE)
                  endif()
                endforeach()
              endif()
              # --- END: INJECTED by CI ---
          FFEOF
            fi
          done

          echo "==== 4) mpv (支持 mpv / mpv-release 两种 EP 名字): meson 追加 -Dopenssl=disabled -Dtls-backend=schannel ===="

          # 4A: 改 ExternalProject_Add 中 meson setup 调用
          for f in $(grep -rlE "ExternalProject_Add\s*\(\s*mpv(|-release)\b" packages cmake . 2>/dev/null); do
            echo "-- patch mpv EP in: $f"
            perl -i -0pe \
              's/(ExternalProject_Add\s*\(\s*mpv(?:-release)?\b.*?CONFIGURE_COMMAND\s+.*?meson\s+setup\b.*?)(\s*\)\s*)$/$1 -Dopenssl=disabled -Dtls-backend=schannel $2/sgi' "$f" \
              || echo "   perl-skip-2: $f"
          done

          # 4B: 兜底：任何 cmake 文件里如果有 mpv 相关 meson options 数组变量，追加上去
          for f in $CMAKE_FILES; do
            [ -f "$f" ] || continue
            if grep -qiE "mpv.*meson|libmpv|MPV_EXTRA|MPV_OPTION|mpv.*option" "$f"; then
              if ! grep -q "MPV_SCHANNEL_INJECTED" "$f"; then
                cat >> "$f" <<'MVEOF'

                # --- BEGIN: INJECTED by CI [MPV_SCHANNEL_INJECTED] ---
                if(COMMAND list)
                  foreach(_v IN ITEMS
                      MPV_MESON_OPTIONS               mpv_MESON_OPTIONS
                      MPV_OPTIONS                     mpv_OPTIONS
                      MPV_EXTRA_OPTIONS               mpv_EXTRA_OPTIONS
                      MPV_ADDITIONAL_MESON_FLAGS      mpv_ADDITIONAL_MESON_FLAGS
                      MPV_CONFIGURE_ARGS              mpv_CONFIGURE_ARGS
                      MPV_EXTRA_MESON_OPTIONS         mpv_EXTRA_MESON_OPTIONS
                      MPV_MESON_EXTRA_FLAGS           mpv_MESON_EXTRA_FLAGS
                      MPV_MESON_ARGS                  mpv_MESON_ARGS)
                    if(DEFINED ${_v})
                      list(APPEND ${_v} "-Dopenssl=disabled" "-Dtls-backend=schannel")
                      set(${_v} "${${_v}}" CACHE INTERNAL "" FORCE)
                    endif()
                  endforeach()
                endif()
                # --- END: INJECTED by CI ---
            MVEOF
              fi
            fi
          done

          echo "==== 5) 终极 sed 兜底: 所有 CMake 文件上的 --enable-openssl / -Dlua= / --enable-gnutls 直接批量改 ===="
          find packages cmake . -maxdepth 4 -type f \( -name '*.cmake' -o -name 'CMakeLists.txt' \) -print0 2>/dev/null \
            | xargs -0 sed -i \
                -e 's/\(-Dlua=[A-Za-z0-9_.-]*\)/\1 -Dopenssl=disabled -Dtls-backend=schannel/g' \
                -e 's/--enable-openssl\b/--disable-openssl --enable-schannel/g' \
                -e 's/--enable-gnutls\b/--disable-gnutls/g' \
                -e 's/--enable-mbedtls\b/--disable-mbedtls/g' \
                -e 's/--enable-libtls\b/--disable-libtls/g' \
              || true

          echo "==== 6) diff 总览（给下一轮失败时定位用） ===="
          git --no-pager diff --stat || true
          echo "--- mpv-release.cmake diff ---"
          git --no-pager diff -- packages/mpv-release.cmake || true

      # -------- CMake configure superbuild (i686) --------
      - name: CMake configure (TARGET_ARCH = i686)
        run: |
          set -e
          SB="${GITHUB_WORKSPACE:-/c/trae}/mpv-winbuild"
          cd "$SB"
          MPV_SRC_WIN="$(cat "$SB/MPV_SRC_WIN.txt")"

          echo "MPV_SRC_WIN=$MPV_SRC_WIN"
          echo "==== packages 目录 list（再次确认新结构） ===="
          ls packages/ 2>/dev/null | head -n 60
          echo "==== mpv-release.cmake 当前 SOURCE_DIR 检查 ===="
          grep -n "SOURCE_DIR\|URL\|GIT_REPO" packages/mpv-release.cmake 2>/dev/null || true

          # TARGET_ARCH = i686  →  superbuild 自动切 MINGW32 工具链
          # 同时：
          #   - 传 MPV_RELEASE_SOURCE_DIR 作为超级兜底（mpv-release ExternalProject
          #     的 CONFIGURE_COMMAND 如果支持以 cache 变量方式取源码路径就会自动用上）
          #   - 再把常见 cache 名（MPV_SOURCE_DIR / MPV_RELEASE_URL / ...）都填一遍
          #   - ffmpeg / mpv 的 no-openssl schannel cache 变量名再多补几种写法
          cmake -S . -B build -G Ninja \
            -DTARGET_ARCH=i686 \
            -DCMAKE_INSTALL_PREFIX="" \
            -DALWAYS_REMOVE_BUILD_DIRS=ON \
            -DMPV_RELEASE_SOURCE_DIR="$MPV_SRC_WIN" \
            -DMPV_SOURCE_DIR="$MPV_SRC_WIN" \
            -DMPV_RELEASE_URL="" \
            -DMPV_RELEASE_GIT_REPOSITORY="" \
            -DMPV_RELEASE_GIT_TAG="" \
            -DMPV_SRC="$MPV_SRC_WIN" \
            -DFFMPEG_EXTRA_OPTIONS="--disable-openssl;--enable-schannel;--disable-gnutls;--disable-mbedtls;--disable-libtls" \
            -DFFMPEG_ADDITIONAL_CONFIGURE_FLAGS="--disable-openssl;--enable-schannel;--disable-gnutls;--disable-mbedtls;--disable-libtls" \
            -DFFMPEG_CONFIGURE_EXTRA_FLAGS="--disable-openssl;--enable-schannel;--disable-gnutls;--disable-mbedtls;--disable-libtls" \
            -DFFMPEG_EXTRA_CONFIGURE_ARGS="--disable-openssl;--enable-schannel;--disable-gnutls;--disable-mbedtls;--disable-libtls" \
            -DMPV_EXTRA_OPTIONS="-Dopenssl=disabled;-Dtls-backend=schannel" \
            -DMPV_EXTRA_MESON_OPTIONS="-Dopenssl=disabled;-Dtls-backend=schannel" \
            -DMPV_ADDITIONAL_MESON_FLAGS="-Dopenssl=disabled;-Dtls-backend=schannel" \
            -DMPV_MESON_EXTRA_FLAGS="-Dopenssl=disabled;-Dtls-backend=schannel"
          echo "---- cmake cache top-entries ----"
          cmake -L -N build | head -n 100
          echo "---- grep cache for mpv / ffmpeg key ----"
          grep -iE "MPV_RELEASE|MPV_SRC|MPV_SOURCE|FFMPEG|MPV_EXTRA|openssl|schannel" build/CMakeCache.txt 2>/dev/null | head -n 60 || true

      # -------- 跑 ninja。预计 2-4 小时。 --------
      - name: Build (ninja superbuild)
        run: |
          set -e
          SB="${GITHUB_WORKSPACE:-/c/trae}/mpv-winbuild"
          cd "$SB/build"
          # -j3: 节省内存（Windows runner 是 4 vCPU，留一点给 OS）
          cmake --build . -j3 -- -v -k0 2>&1 | tail -n 500

      # -------- 找产物：libmpv-2.dll (i686 superbuild 默认装到 local32/bin) --------
      - name: Locate libmpv-2.dll + dependencies
        run: |
          set -e
          SB="${GITHUB_WORKSPACE:-/c/trae}/mpv-winbuild"
          cd "$SB"
          echo "==== tree of build/local* / build/mpv* ===="
          find build/local* build/mpv* build/install* build/root* \
               -maxdepth 5 -type f \( -name 'libmpv-2.dll' -o -name 'mpv-2.dll' -o -name 'mpv.exe' \) 2>/dev/null || true

          DLL="$(find build -type f \( -name 'libmpv-2.dll' -o -name 'mpv-2.dll' \) -print -quit)"
          if [ -z "$DLL" ]; then
            echo "!!! libmpv-2.dll NOT FOUND; listing all .dll under build/"
            find build -type f -name '*.dll' -o -name '*.exe' 2>/dev/null | head -n 200
            exit 21
          fi
          echo "FOUND_DLL=${DLL}"
          ls -la "$DLL"
          file "$DLL" || true

          OUTDIR="${GITHUB_WORKSPACE:-/c/trae}/artifact"
          mkdir -p "$OUTDIR"
          cp -f "$DLL" "$OUTDIR/libmpv-2.dll"

          # mpv superbuild 把 ffmpeg/bluray/dvdnav 等所有依赖都默认**静态**链接进了 libmpv-2.dll，
          # 所以一般情况下 libmpv-2.dll 一个文件就够你在易语言里 LoadLibrary 用了。
          # 这里也把同目录下的 mpv.exe / 导入库 / 头文件都拷上，留作以后调试：
          BASEDIR="$(dirname "$DLL")"
          [ -f "${BASEDIR}/mpv.exe"      ] && cp -f "${BASEDIR}/mpv.exe"         "$OUTDIR/" || true
          [ -f "${BASEDIR}/libmpv.dll.a" ] && cp -f "${BASEDIR}/libmpv.dll.a"    "$OUTDIR/" || true
          IMP="$(find build -type f -name 'libmpv.dll.a' -print -quit)"
          [ -n "$IMP" ] && cp -f "$IMP" "$OUTDIR/libmpv.dll.a" || true
          CLIENT_H="$(find build -type f -path '*/mpv/*/client.h' -print -quit)"
          [ -z "$CLIENT_H" ] && CLIENT_H="$(find mpv source sources -type f -name 'client.h' -path '*/mpv/*' -print -quit 2>/dev/null || true)"
          [ -n "$CLIENT_H" ] && cp -f "$CLIENT_H" "$OUTDIR/mpv_client.h" || true

          echo "==== artifact dir ===="
          ls -la "$OUTDIR/"

      # -------- 上传 --------
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libmpv-2-i686-schannel-superbuild
          path: ${{ github.workspace }}/artifact/*
          if-no-files-found: error
          compression-level: 6
